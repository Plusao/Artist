<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backstage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout : une colonne mobile, en-tête collant (argent, énergie, semaine), onglets en bas. Monde unique, nuit de salle de concert. */
  color-scheme:dark;
  --bg:#131019; --surface:#1d1926; --raised:#282234; --line:#352e44;
  --text:#f4eee4; --muted:#a79fb5;
  --accent:#ff5a4e; --accent-ink:#1a0d0b;
  --gold:#f2c14e; --good:#63d6a3; --bad:#ff7d8f; --cool:#7fb2ff;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
h1,h2,h3,.disp{font-family:var(--display);text-wrap:balance;letter-spacing:-.02em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px} .good{color:var(--good)} .bad{color:var(--bad)} .gold{color:var(--gold)}

/* en-tête */
.top{position:sticky;top:0;z-index:5;background:rgba(19,16,25,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:12px;align-items:center}
.top .info{flex:1;min-width:0}
.top .money{font:700 19px var(--display)}
.ebar{height:6px;background:var(--raised);border-radius:9px;overflow:hidden;margin-top:6px}
.ebar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:9px;transition:width .3s}
.next{background:var(--accent);color:var(--accent-ink);font:700 12px var(--display);padding:12px 14px;border-radius:999px;white-space:nowrap}
.next small{display:block;font:600 11px var(--body);opacity:.8}

main{flex:1;padding:16px 16px 96px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1;min-width:0}
.sep{border-top:1px solid var(--line);padding-top:10px}
.btn{background:var(--raised);border:1px solid var(--line);padding:9px 13px;border-radius:11px;font-weight:600;font-size:13.5px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--raised);color:var(--muted);white-space:nowrap}
.pill.or{background:#4a3a12;color:var(--gold)} .pill.pla{background:#2f3340;color:#dfe6f5} .pill.dia{background:#16384a;color:#9fe6ff}
.pill.hot{background:#4a1c18;color:var(--accent)} .pill.ok{background:#173a2c;color:var(--good)}
.cost{font-size:12px;color:var(--muted);white-space:nowrap}
.cost b{color:var(--accent)}

/* héros */
.hero{background:radial-gradient(120% 140% at 100% 0%,#4a1c2a 0%,var(--surface) 55%);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.hero h1{font-size:clamp(26px,8vw,38px);font-weight:900;line-height:1;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(0,0,0,.25);border-radius:12px;padding:9px 10px}
.stat b{display:block;font:700 15px var(--display)}
.stat span{font-size:11.5px;color:var(--muted)}

/* sous-onglets */
.subs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.subs button{padding:8px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:13px;white-space:nowrap;color:var(--muted)}
.subs button.on{background:var(--text);color:var(--bg);border-color:var(--text)}

/* compétences */
.skill{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center}
.skill .lv{font:700 20px var(--display)}
.bar{height:5px;background:var(--raised);border-radius:9px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--cool);border-radius:9px}

/* classement */
.chart{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.chart:last-child{border:0}
.chart .rk{font:700 15px var(--display);color:var(--muted)}
.chart.me{background:linear-gradient(90deg,rgba(255,90,78,.16),transparent);margin:0 -14px;padding:8px 14px;border-radius:8px}
.chart.me .rk{color:var(--accent)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* nav */
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:rgba(19,16,25,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{padding:8px 0;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:12px}
nav button.on{color:var(--accent)}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* modale + toast */
.veil{position:fixed;inset:0;z-index:20;background:rgba(8,6,12,.72);display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:88%;overflow-y:auto;padding:20px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:up .22s ease-out}
.modal h2{font-size:19px;font-weight:700}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.modal{animation:none}.ebar i{transition:none}}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],select{background:var(--raised);border:1px solid var(--line);border-radius:11px;padding:11px 12px;color:var(--text);width:100%}
.line{display:flex;justify-content:space-between;gap:10px;font-size:14px}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:30;background:var(--text);color:var(--bg);font-weight:600;font-size:13.5px;padding:10px 16px;border-radius:12px;max-width:min(92vw,480px);text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}

/* création */
.intro{padding:28px 16px 40px;display:flex;flex-direction:column;gap:18px}
.logo{font:900 clamp(40px,13vw,64px)/.9 var(--display);letter-spacing:-.05em}
.logo em{font-style:normal;color:var(--accent)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chips button{padding:8px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px}
.chips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pick{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:3px;width:100%}
.pick.on{border-color:var(--accent);background:#2a1a20}
.pick b{font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:400px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script>
"use strict";
/* ============ OUTILS ============ */
const rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(n){n=Math.round(n);const a=Math.abs(n);
  if(a>=1e9)return (n/1e9).toFixed(2).replace('.',',')+' Md';
  if(a>=1e6)return (n/1e6).toFixed(a>=1e7?1:2).replace('.',',')+' M';
  if(a>=1e4)return (n/1e3).toFixed(a>=1e5?0:1).replace('.',',')+' k';
  return n.toLocaleString('fr-FR');}
const eur=n=>fmt(n)+' €';

/* ============ DONNÉES ============ */
const GENRES=['Rap','Pop','R&B','Afro','Électro','Rock','Drill','Variété'];
const SK={voix:'Voix',ecriture:'Écriture',flow:'Flow & rythme',charisme:'Charisme',viralite:'Viralité',clips:'Réalisation de clips',leadership:'Leadership',marketing:'Marketing',nego:'Négociation'};
const ART=['voix','ecriture','flow','charisme','viralite','clips'], BIZ=['leadership','marketing','nego'];
const PROFILES=[
 {id:'debutant',n:'Débutant',d:'Tu pars de zéro. 300 € en poche, un micro USB et des rêves.',lvl:[12,20],biz:[5,12],money:300,fans:0,fol:40,age:18},
 {id:'inde',n:'Indé en montée',d:'Quelques sons qui tournent, une petite fanbase, 4 000 € de côté.',lvl:[32,42],biz:[20,30],money:4000,fans:3500,fol:6000,age:22},
 {id:'confirme',n:'Artiste confirmé',d:'Déjà installé dans le game. 250 k fans et 120 000 € sur le compte.',lvl:[58,68],biz:[40,55],money:120000,fans:250000,fol:400000,age:27},
];
const FANTASY=[
 {id:'nepo',n:'Enfant de star',d:'Papa est une légende. 500 000 €, des contacts partout, mais zéro talent prouvé.',lvl:[10,18],biz:[25,40],money:500000,fans:20000,fol:90000,age:19},
 {id:'viral',n:'Star des réseaux',d:'600 k abonnés grâce à tes vidéos. Reste à prouver que tu sais faire de la musique.',lvl:[10,16],biz:[20,35],money:8000,fans:15000,fol:600000,age:20,set:{viralite:72,charisme:58}},
 {id:'prodige',n:'Prodige fauché',d:'Un talent brut hors norme. 0 €, 0 fan, 0 réseau.',lvl:[62,72],biz:[3,8],money:0,fans:0,fol:10,age:17,set:{charisme:25,viralite:15,clips:10}},
 {id:'dechu',n:'Légende déchue',d:'Tu as tout eu, tout perdu. 400 k fans nostalgiques et 150 000 € de dettes.',lvl:[66,76],biz:[30,45],money:-150000,fans:400000,fol:250000,age:41,health:45},
];
const STATUS=[[0,'Inconnu'],[500,'Talent local'],[1e4,'Espoir'],[1e5,'Révélation'],[1e6,"Tête d'affiche"],[1e7,'Superstar'],[5e7,'Icône mondiale']];
const EFFORT=[{n:'Freestyle express',e:12,b:0},{n:'Titre travaillé',e:22,b:6},{n:'Perfectionniste',e:36,b:12}];
const STUDIO=[{n:'Chambre + micro USB',c:0,b:0},{n:'Studio de quartier',c:150,b:4},{n:'Studio pro',c:1200,b:8},{n:'Studio de légende',c:15000,b:13}];
const BEAT=[{n:'Type beat gratuit',c:0,b:0},{n:'Beatmaker local',c:400,b:4},{n:'Producteur confirmé',c:6000,b:8},{n:'Hitmaker international',c:90000,b:13}];
const CLIP=[{n:'Clip tourné au téléphone',c:0,b:0},{n:'Clip pro',c:8000,b:15},{n:'Superproduction',c:250000,b:30}];
const ADS=[{c:300,h:.15},{c:3000,h:.3},{c:30000,h:.5},{c:300000,h:.8}];
const VENUES=[{n:'Scène ouverte',cap:60,min:0,p:0},{n:'Bar concert',cap:150,min:300,p:8},{n:'Petite salle',cap:600,min:3000,p:15},{n:'Salle mythique',cap:2000,min:20000,p:28},{n:'Zénith',cap:8000,min:120000,p:40},{n:'Arena',cap:20000,min:600000,p:55},{n:'Stade',cap:70000,min:3e6,p:75}];
const TOURS=[{n:'Tournée des bars',v:1,d:6},{n:'Tournée des salles',v:3,d:10},{n:'Tournée des Zéniths',v:4,d:14},{n:'Tournée des Arenas',v:5,d:20},{n:'Tournée mondiale des stades',v:6,d:30}];
const LABELS=[{n:['Rue 9 Records','Cave 12','Minuit Disques'],min:1500,share:.45,mult:1.5,adv:1.5,songs:6,t:'Label indé'},{n:['Atlas Music','Polygone Musique'],min:40000,share:.30,mult:2.3,adv:2,songs:12,t:'Gros label'},{n:['Empire Sound Group','Monde Universel'],min:400000,share:.25,mult:3.2,adv:3,songs:18,t:'Major'}];
const JOBS=[{n:'Livreur à vélo',pay:180,e:25},{n:'Vendeur en boutique',pay:320,e:35},{n:'Prof de chant',pay:460,e:30,req:['voix',40]},{n:'Ingé son en studio',pay:650,e:35,req:['flow',50]}];
const HOMES=[{n:'Chez les parents',c:0,e:0},{n:'Colocation',c:120,e:5},{n:'Studio en ville',c:260,e:10},{n:'Bel appartement',c:650,e:16},{n:'Loft d\'artiste',c:2600,e:26},{n:'Villa sur les hauteurs',c:12000,e:40}];
const ITEMS=[
 {id:'f1',cat:'Style',n:'Friperie stylée',c:200,ch:1,im:1},{id:'f2',cat:'Style',n:'Garde-robe streetwear',c:3000,ch:2,im:2},{id:'f3',cat:'Style',n:'Styliste perso',c:40000,ch:3,im:4},{id:'f4',cat:'Style',n:'Haute couture sur mesure',c:400000,ch:4,im:7},
 {id:'t1',cat:'Transport',n:'Scooter',c:2500,ch:0,im:1},{id:'t2',cat:'Transport',n:'Berline',c:35000,ch:0,im:3},{id:'t3',cat:'Transport',n:'Supercar',c:350000,ch:1,im:6},{id:'t4',cat:'Transport',n:'Jet privé',c:25e6,ch:2,im:12},
];
const TEAM=[{id:'manager',n:'Manager',d:'Prend 10 % de tes revenus musicaux. Double les opportunités et gonfle les avances.',w:0,ld:15},{id:'cm',n:'Community manager',d:'Fait grossir tes réseaux tout seul chaque semaine.',w:300,ld:25},{id:'coach',n:'Coach artistique',d:'+1 dans une compétence artistique toutes les 2 semaines.',w:450,ld:35},{id:'presse',n:'Attaché de presse',d:'La hype de tes sons retombe beaucoup moins vite.',w:900,ld:50}];
const PROPS=[{n:'Place de parking',c:18000,r:25},{n:'Studio étudiant',c:110000,r:140},{n:'T3 centre-ville',c:380000,r:430},{n:'Immeuble de rapport',c:2.4e6,r:3000},{n:'Studio d\'enregistrement',c:6e6,r:9000,note:'+3 de qualité sur tous tes sons'},{n:'Salle de concert',c:2e7,r:32000}];
const ASSETS=[{id:'idx',n:'Indice Monde',d:'Fonds diversifié, tranquille',dr:.0016,vol:.02},{id:'nova',n:'NovaTech',d:'Action tech, ça bouge',dr:.003,vol:.055},{id:'strm',n:'Streamly',d:'Plateforme de streaming',dr:.0022,vol:.04},{id:'orb',n:'Orbit Coin',d:'Crypto, très risqué',dr:.004,vol:.14},{id:'or',n:'Or',d:'Valeur refuge',dr:.0008,vol:.012}];
const NETS=[{id:'vibe',n:'Vibe',d:'Vidéos courtes',acts:['post','trend']},{id:'pixa',n:'Pixa',d:'Photos et stories',acts:['post','live']},{id:'echo',n:'Écho',d:'Posts et débats',acts:['post','clash']}];
const NPCS=['Kaïro','Lune Noire','Santo Vega','Mila Rêve','Dex 9','Ysé','Bando Soleil','Calypso M','Nox','Jade Orion','Rimo','Les Faubourgs','Eden Park','Oumi','Tarek Sol','Vénus Club','Hakim Delta','Sacha Nord','Lou Minuit','Anaïs Volt','Marlo','Sélène','Kobalt','Izia Flore','Tony Braise','Néo Sahara'];
const W1=['Minuit','Soleil','Nuit','Rêve','Bitume','Vertige','Fumée','Diamant','Feu','Ciel','Mirage','Paname','Lyon','Été','Cœur','Fantôme','Néon','Orage','Vague','Ombre'];
const W2=['noir','d\'or','éternel','sans toi','en boucle','sous la pluie','à 200','du sud','et moi','perdu','sauvage','brûlant','en bas','de trop','en cavale'];
const title=()=>Math.random()<.3?pick(W1):pick(W1)+' '+pick(W2);
const TALENT=['Lina K','Sofiane B','Rose Indigo','Malo','Twins 69','Inès Aura','Yanis Zed','Clara Nuit','Bams','Elio'];

/* ============ ÉTAT ============ */
let G=null, tab='home', sub={music:'studio',charts:'top',life:'skills'}, draft={genre:'Rap',profile:'debutant'};
const KEY='backstage-save-v1';
function save(){try{localStorage.setItem(KEY,JSON.stringify(G))}catch(e){}}
function load(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return null}}

function newGame(name,genre,pid){
  const p=[...PROFILES,...FANTASY].find(x=>x.id===pid);
  const skills={};
  ART.forEach(k=>skills[k]=ri(p.lvl[0],p.lvl[1])); BIZ.forEach(k=>skills[k]=ri(p.biz[0],p.biz[1]));
  Object.assign(skills,p.set||{});
  G={v:1,name,genre,profile:p.n,age:p.age,t:0,money:p.money,fans:p.fans,energy:100,health:p.health||85,skills,
    songs:[],albums:[],nid:1,label:null,own:null,social:{vibe:Math.round(p.fol*.5),pixa:Math.round(p.fol*.3),echo:Math.round(p.fol*.2)},
    offers:[],news:[],job:null,home:pid==='debutant'||pid==='prodige'?0:pid==='inde'?1:pid==='viral'?2:pid==='dechu'?2:3,items:[],team:{},
    livret:0,props:[],stocks:{},prices:{},hist:{},chart:[],feats:[],tour:null,trend:pick(GENRES),gig:-1,lastRel:0,nextBonus:0,
    tot:{streams:0,rev:0,no1:0},yr:{streams:0,best:99,albumQ:0},awards:[],last:null,rest:0,prospects:[],fanHist:[p.fans]};
  ASSETS.forEach(a=>{G.prices[a.id]=100;G.stocks[a.id]={u:0,cost:0};G.hist[a.id]=[100]});
  for(let i=0;i<45;i++)G.chart.push(npcSong(true));
  genFeats();
  G.energy=maxE();
  news(`${name} entre dans le game. Profil : ${p.n}.`);
  save();
}
function npcSong(old){return{title:title(),artist:pick(NPCS),s:250000*Math.exp(rnd(0,old?3.1:3.4)),age:old?ri(0,20):0}}
function genFeats(){G.feats=[2e4,3e5,3e6].map(f=>{const fans=Math.round(f*rnd(.6,1.8));return{name:pick(NPCS),fans,price:Math.round(fans*.07)}})}
function news(txt){G.news.unshift({t:G.t,txt});if(G.news.length>40)G.news.pop()}

/* ============ CALCULS ============ */
const week=()=>G.t%52+1, year=()=>2026+Math.floor(G.t/52);
const followers=()=>G.social.vibe+G.social.pixa+G.social.echo;
const image=()=>G.items.reduce((a,id)=>a+ITEMS.find(i=>i.id===id).im,0)+G.home*2;
const status=()=>[...STATUS].reverse().find(s=>G.fans>=s[0])[1];
const hasProp=n=>G.props.some(p=>PROPS[p.i].n===n);
function maxE(){return Math.max(20,100+HOMES[G.home].e-(G.health<40?20:0)-(G.job!=null?JOBS[G.job].e:0)-(G.tour?30:0))}
function share(){return G.own?1:G.label?G.label.share:.85}
function lmult(){return G.own?1.6+G.skills.marketing/200:G.label?G.label.mult:1}
function netWorth(){let v=G.money+G.livret;ASSETS.forEach(a=>v+=G.stocks[a.id].u*G.prices[a.id]);G.props.forEach(p=>v+=p.val);return v}
const released=()=>G.songs.filter(s=>s.rel!=null), drawer=()=>G.songs.filter(s=>s.rel==null);
function cert(total,th){const n=['Or','Platine','Diamant'];let c=null;th.forEach((x,i)=>{if(total>=x)c=n[i]});return c}
const CS=[15e6,30e6,50e6], CA=[5e4,1e5,5e5];
const certPill=c=>c?`<span class="pill ${c==='Or'?'or':c==='Platine'?'pla':'dia'}">${c}</span>`:'';

/* ============ ACTIONS DE BASE ============ */
let toastT;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)}
function useE(n){if(G.energy<n){toast(`Pas assez d'énergie (il te faut ${n}). Passe à la semaine suivante.`);return false}G.energy-=n;return true}
function canPay(n){if(G.money<n){toast(`Il te manque ${eur(n-G.money)}.`);return false}return true}
function gain(k,n=1){G.skills[k]=clamp(G.skills[k]+n,0,100)}
function addFans(n){G.fans=Math.max(0,Math.round(G.fans+n))}

/* ============ FIN DE SEMAINE ============ */
function endWeek(){
  const R={inc:[],exp:[],streams:0,fans0:G.fans,top:null,certs:[]};
  const inc=(l,v)=>{if(v>=1){R.inc.push([l,v]);G.money+=v}}, exp=(l,v)=>{if(v>=1){R.exp.push([l,v]);G.money-=v}};
  const sh=share(), lm=lmult();
  let stream=0, video=0, fansNew=0;
  // streams
  const nRel=Math.max(1,released().filter(x=>G.t-x.rel<20).length);
  released().forEach(s=>{

function awards(R){

  ss.forEach(s=>{s.alb=t;if(s.rel==null)release(s,1.25);else s.hype=Math.min(3,s.hype+.25)});
  const units=G.fans*.03*(avg/60)*rnd(.7,1.3)*(big?1:.5), rev=units*9*share();
  G.albums.push({title:t,ids,rel:G.t,units,cert:null,q:Math.round(avg)}); G.money+=rev; G.yr.albumQ=Math.max(G.yr.albumQ,big?avg:avg-10);
  news(`${big?'L\'album':'L\'EP'} « ${t} » est sorti (${ids.length} titres).`);
  save();render();info(`« ${esc(t)} » est dans les bacs`,`${big?'Album':'EP'} de ${ids.length} titres, note moyenne ${Math.round(avg)}/100.<br>Ventes de la première semaine : <b>${fmt(units)}</b> exemplaires, soit ${eur(rev)} pour toi.`);return true},
 promo(v){const s=G.songs.find(x=>x.id==v);if(s.pt===G.t){toast('Déjà promu cette semaine.');return}if(!useE(8))return;
  const h=.1+Math.min(.15,followers()/(G.fans+1000)*.1)+G.skills.marketing/100*.3;s.hype=Math.min(3,s.hype+h);s.pt=G.t;toast(`Hype de « ${s.title} » : +${Math.round(h*100)} %`)},
 clipform(v){modal(`<h2>Tourner un clip</h2><p class="small muted">Un clip relance la hype du son et rapporte des revenus vidéo. Sa qualité dépend de ta compétence en réalisation.</p>${CLIP.map((c,i)=>`<div class="row sep"><div class="grow"><b>${c.n}</b><div class="small muted">Bonus qualité +${c.b}</div></div>${cost(18,c.c)}<button class="btn pri" data-a="clip" data-v="${v},${i}">Tourner</button></div>`).join('')}<button class="btn" data-a="close">Annuler</button>`);return true},
 clip(v){const[id,i]=v.split(',').map(Number),s=G.songs.find(x=>x.id===id),c=CLIP[i];if(!canPay(c.c)||!useE(18))return true;G.money-=c.c;
  s.clip=clamp(Math.round(G.skills.clips*.7+c.b+rnd(-5,8)),5,100);s.hype=Math.min(3,s.hype+s.clip/100*.8);if(Math.random()<.4)gain('clips');
  news(`Le clip de « ${s.title} » est en ligne.`);closeModal();toast(`Clip noté ${s.clip}/100`)},
 adform(v){modal(`<h2>Campagne sponsorisée</h2><p class="small muted">Tu paies pour pousser le son dans les fils d'actu. Ton marketing rend la campagne plus efficace.</p>${ADS.map((a,i)=>`<div class="row sep"><div class="grow"><b>Budget ${eur(a.c)}</b><div class="small muted">Environ ${fmt(a.c*60)} écoutes garanties</div></div><button class="btn pri" data-a="ad" data-v="${v},${i}">Lancer</button></div>`).join('')}<button class="btn" data-a="close">Annuler</button>`);return true},
 ad(v){const[id,i]=v.split(',').map(Number),s=G.songs.find(x=>x.id===id),a=ADS[i];if(!canPay(a.c))return true;G.money-=a.c;
  s.hype=Math.min(3,s.hype+a.h*(1+G.skills.marketing/200));s.ad=(s.ad||0)+a.c*60*(1+G.skills.marketing/100);closeModal();toast('Campagne lancée, résultats en fin de semaine.')},

 /* label */
 sign(v){const o=G.offers[v];G.label={name:o.name,tier:o.tier,share:o.share,mult:o.mult,left:o.songs,adv:o.adv};G.money+=o.adv;G.offers.splice(v,1);news(`Tu signes chez ${o.name}. Avance : ${eur(o.adv)}.`);toast('Contrat signé !')},
 nego(v){const o=G.offers[v];o.neg=true;if(Math.random()<.25+G.skills.nego/130){o.share=Math.min(.6,o.share+.05);o.adv=Math.round(o.adv*1.25);if(Math.random()<.5)gain('nego');toast('Négociation réussie : meilleure part et meilleure avance.')}
  else if(Math.random()<.3){G.offers.splice(v,1);toast('Le label s\'est vexé et retire son offre.')}else toast('Ils ne bougent pas d\'un centime.')},
 decl(v){G.offers.splice(v,1)},
 breakform(){modal(`<h2>Racheter ton contrat ?</h2><p>Ça te coûte ${eur(G.label.adv*1.2)} et tu redeviens indépendant.</p><div class="row"><button class="btn pri" data-a="break">Racheter</button><button class="btn" data-a="close">Annuler</button></div>`);return true},
 break(){const c=G.label.adv*1.2;if(!canPay(c))return true;G.money-=c;news(`Tu quittes ${G.label.name} et redeviens indépendant.`);G.label=null;closeModal()},
 ownlabel(){const n=document.getElementById('in-label').value.trim();if(!n){toast('Donne un nom à ton label.');return true}G.money-=1.5e6;G.own={name:n,roster:[]};news(`Tu fondes ton label : ${n}.`)},
 signtal(v){const p=G.prospects[v];if(G.own.roster.length>=5){toast('Ton roster est complet (5 artistes).');return}if(!canPay(p.c))return;G.money-=p.c;G.own.roster.push({name:p.name,pot:p.pot});G.prospects.splice(v,1);if(Math.random()<.5)gain('leadership');news(`${p.name} rejoint ${G.own.name}.`)},

 /* opportunités */
 take(v){const o=G.offers[v],e={festival:30,brand:10,feat:15}[o.type];if(!useE(e))return;G.money+=o.pay;G.offers.splice(v,1);
  if(o.type==='festival'){const g=Math.round(100+G.fans*.03*(1+G.skills.charisme/100));addFans(g);news(`Tu retournes le ${o.name}. +${fmt(g)} fans.`);toast(`+${eur(o.pay)} et +${fmt(g)} fans`)}
  if(o.type==='brand'){toast(`+${eur(o.pay)} encaissés`)}
  if(o.type==='feat'){const g=Math.round(50+G.fans*.015);addFans(g);toast(`+${eur(o.pay)} et +${fmt(g)} fans`)}},

 /* scène */
 gig(v){const V=VENUES[v];if(!useE(25))return;G.gig=G.t;
  if(!V.p){const m=ri(20,60),g=ri(4,22)+Math.round(G.skills.charisme/5);G.money+=m;addFans(g);if(Math.random()<.3)gain('charisme');toast(`Scène ouverte : +${m} € au chapeau, +${g} fans`);return}
  const att=Math.round(Math.min(V.cap,Math.max(8,G.fans*.05*(.6+G.skills.charisme/100)))*rnd(.8,1)),rev=att*V.p*.6-V.cap*1.5,g=Math.round(att*.07*(1+G.skills.charisme/100));
  G.money+=rev;addFans(g);if(Math.random()<.25)gain('charisme');
  save();render();info(V.n,`${fmt(att)} personnes sur ${fmt(V.cap)} places. ${att>=V.cap*.95?'Complet !':att<V.cap*.4?'La salle sonnait un peu creux.':'Belle ambiance.'}<br>Résultat : <b class="${rev<0?'bad':'good'}">${eur(rev)}</b> après les frais, +${fmt(g)} fans.`);return true},
 tour(v){const T=TOURS[v],c=T.d*VENUES[T.v].cap*3;if(!canPay(c))return;G.money-=c;G.tour={i:+v,done:0};G.energy=Math.min(G.energy,maxE());news(`Tu pars en tournée : ${T.n}, ${T.d} dates.`);toast('La tournée démarre la semaine prochaine.')},

 /* réseaux */
 soc(v){const[n,a]=v.split(','),e=ACTL[a][1];if(!useE(e))return;const f=G.social[n],k=(1+(G.skills.charisme+G.skills.viralite)/60)*(1+image()/25);let g=0,msg='';
  if(a==='post'){g=Math.round(rnd(10,30)*k+f*rnd(.004,.012));msg=`+${fmt(g)} abonnés`}
  if(a==='trend'){if(Math.random()<.1+G.skills.viralite/220){g=Math.round(400*k+f*rnd(.08,.2));msg=`Le trend explose : +${fmt(g)} abonnés`}else{g=Math.round(rnd(5,20)*k);msg=`Flop relatif, +${fmt(g)} abonnés`}if(Math.random()<.3)gain('viralite')}
  if(a==='live'){g=Math.round(rnd(8,20)*k+f*.004);const d=Math.round(f*.003*rnd(.3,1));G.money+=d;addFans(f*.004);msg=`Live sympa : +${fmt(g)} abonnés, ${eur(d)} de dons`}
  if(a==='clash'){if(Math.random()<.5){g=Math.round(300*k+f*rnd(.05,.12));msg=`Tu gagnes le clash : +${fmt(g)} abonnés`;if(Math.random()<.3)gain('viralite')}else{g=-Math.round(f*.04);addFans(-G.fans*.01);msg=`Tu te fais ratio : ${fmt(g)} abonnés`}}
  G.social[n]=Math.max(0,f+g);if(g>0)addFans(g*.25);toast(msg)},

 /* vie */
 train(k){const lv=G.skills[k];if(!useE(8+Math.floor(lv/6)))return;gain(k,lv<40&&Math.random()<.5?2:1)},
 coach(k){const lv=G.skills[k],c=100+lv*lv;if(!canPay(c)||!useE(8+Math.floor(lv/6)))return;G.money-=c;gain(k,3)},
 health(v){v=+v;if(v===0){if(!canPay(20)||!useE(10))return;G.money-=20;G.health=Math.min(100,G.health+5)}
  if(v===1){if(!useE(30))return;G.health=Math.min(100,G.health+13)}
  if(v===2){if(!canPay(1500))return;G.money-=1500;G.health=Math.min(100,G.health+25)}toast(`Santé : ${Math.round(G.health)}/100`)},
 job(v){v=+v;G.job=v<0?null:v;G.energy=Math.min(G.energy,maxE());toast(v<0?'Tu rends ton tablier.':`Embauché : ${JOBS[v].n}. L'énergie max baisse.`)},
 home(v){v=+v;const dep=HOMES[v].c*2;if(v>G.home&&!canPay(dep))return;if(v>G.home)G.money-=dep;G.home=v;G.energy=Math.min(G.energy,maxE());toast(`Nouvelle adresse : ${HOMES[v].n}${v&&dep?` (caution ${eur(dep)})`:''}`)},
 buy(v){const x=ITEMS.find(i=>i.id===v);if(!canPay(x.c))return;G.money-=x.c;G.items.push(v);gain('charisme',x.ch);toast(`${x.n} : c'est à toi.`)},
 hire(v){G.team[v]=true;toast('Bienvenue dans l\'équipe.')}, fire(v){delete G.team[v]},
 liv(v){v=+v;if(v<0){G.money+=G.livret;G.livret=0}else{if(!canPay(v))return;G.money-=v;G.livret+=v}},
 stk(v){const[id,n]=v.split(','),amt=+n,s=G.stocks[id];if(amt<0){G.money+=s.u*G.prices[id];s.u=0;s.cost=0;toast('Position vendue.')}else{if(!canPay(amt))return;G.money-=amt;s.u+=amt/G.prices[id];s.cost+=amt}},
 buyp(v){const p=PROPS[v];if(!canPay(p.c))return;G.money-=p.c;G.props.push({i:+v,val:p.c});toast(`${p.n} acheté.`)},
 sellp(v){const p=G.props[v];G.money+=p.val*.95;G.props.splice(v,1);toast('Bien vendu (5 % de frais).')},
};
function release(s,hype){s.rel=G.t;s.hype=hype;G.lastRel=G.t;if(G.label){G.label.left--;if(G.label.left<=0){news(`Contrat rempli : tu es libre de ${G.label.name}.`);G.label=null}}}
function keepName(){const i=document.getElementById('in-name');if(i)draft.name=i.value.trim()}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el||el.disabled)return;
  if(el.id==='veil'&&e.target!==el)return;
  const fn=A[el.dataset.a];if(!fn)return;
  const handled=fn(el.dataset.v,el);
  if(G&&!handled)save();
  if(!handled)render();
});
document.addEventListener('submit',e=>e.preventDefault());

function start(data){
  if(data&&data.G&&data.G.name){G=data.G}
  render();
}
window.claude?.hot?.snapshot(()=>({G}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
</body>
</html>
