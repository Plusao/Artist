<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Backstage">
<title>BACKSTAGE — Ta carrière. Tes règles.</title>
<meta name="theme-color" content="#111c1b">
<meta name="description" content="Le simulateur de carrière musicale. De ta chambre aux stades : musique, réseaux, labels et vie d’artiste.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout : une colonne mobile, en-tête collant (argent, énergie, semaine), onglets en bas. Monde unique, nuit de salle de concert. */
  color-scheme:dark;
  --bg:#131019; --surface:#1d1926; --raised:#282234; --line:#352e44;
  --text:#f4eee4; --muted:#a79fb5;
  --accent:#ff5a4e; --accent-ink:#1a0d0b;
  --gold:#f2c14e; --good:#63d6a3; --bad:#ff7d8f; --cool:#7fb2ff;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
h1,h2,h3,.disp{font-family:var(--display);text-wrap:balance;letter-spacing:-.02em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px} .good{color:var(--good)} .bad{color:var(--bad)} .gold{color:var(--gold)}

/* en-tête */
.top{position:sticky;top:0;z-index:5;background:rgba(19,16,25,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:12px;align-items:center}
.top .info{flex:1;min-width:0}
.top .money{font:700 19px var(--display)}
.ebar{height:6px;background:var(--raised);border-radius:9px;overflow:hidden;margin-top:6px}
.ebar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:9px;transition:width .3s}
.next{background:var(--accent);color:var(--accent-ink);font:700 12px var(--display);padding:12px 14px;border-radius:999px;white-space:nowrap}
.next small{display:block;font:600 11px var(--body);opacity:.8}

main{flex:1;padding:16px 16px 96px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1;min-width:0}
.sep{border-top:1px solid var(--line);padding-top:10px}
.btn{background:var(--raised);border:1px solid var(--line);padding:9px 13px;border-radius:11px;font-weight:600;font-size:13.5px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--raised);color:var(--muted);white-space:nowrap}
.pill.or{background:#4a3a12;color:var(--gold)} .pill.pla{background:#2f3340;color:#dfe6f5} .pill.dia{background:#16384a;color:#9fe6ff}
.pill.hot{background:#4a1c18;color:var(--accent)} .pill.ok{background:#173a2c;color:var(--good)}
.cost{font-size:12px;color:var(--muted);white-space:nowrap}
.cost b{color:var(--accent)}

/* héros */
.hero{background:radial-gradient(120% 140% at 100% 0%,#4a1c2a 0%,var(--surface) 55%);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.hero h1{font-size:clamp(26px,8vw,38px);font-weight:900;line-height:1;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(0,0,0,.25);border-radius:12px;padding:9px 10px}
.stat b{display:block;font:700 15px var(--display)}
.stat span{font-size:11.5px;color:var(--muted)}

/* sous-onglets */
.subs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.subs button{padding:8px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:13px;white-space:nowrap;color:var(--muted)}
.subs button.on{background:var(--text);color:var(--bg);border-color:var(--text)}

/* compétences */
.skill{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center}
.skill .lv{font:700 20px var(--display)}
.bar{height:5px;background:var(--raised);border-radius:9px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--cool);border-radius:9px}

/* classement */
.chart{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.chart:last-child{border:0}
.chart .rk{font:700 15px var(--display);color:var(--muted)}
.chart.me{background:linear-gradient(90deg,rgba(255,90,78,.16),transparent);margin:0 -14px;padding:8px 14px;border-radius:8px}
.chart.me .rk{color:var(--accent)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* nav */
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:rgba(19,16,25,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{padding:8px 0;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:12px}
nav button.on{color:var(--accent)}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* modale + toast */
.veil{position:fixed;inset:0;z-index:20;background:rgba(8,6,12,.72);display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:88%;overflow-y:auto;padding:20px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:up .22s ease-out}
.modal h2{font-size:19px;font-weight:700}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.modal{animation:none}.ebar i{transition:none}}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],select{background:var(--raised);border:1px solid var(--line);border-radius:11px;padding:11px 12px;color:var(--text);width:100%}
.line{display:flex;justify-content:space-between;gap:10px;font-size:14px}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:30;background:var(--text);color:var(--bg);font-weight:600;font-size:13.5px;padding:10px 16px;border-radius:12px;max-width:min(92vw,480px);text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}

/* création */
.intro{padding:28px 16px 40px;display:flex;flex-direction:column;gap:18px}
.logo{font:900 clamp(40px,13vw,64px)/.9 var(--display);letter-spacing:-.05em}
.logo em{font-style:normal;color:var(--accent)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chips button{padding:8px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px}
.chips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pick{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:3px;width:100%}
.pick.on{border-color:var(--accent);background:#2a1a20}
.pick b{font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:400px){.grid2{grid-template-columns:1fr}}

    songs:[],albums:[],nid:1,label:null,own:null,social:{vibe:Math.round(p.fol*.5),pixa:Math.round(p.fol*.3),echo:Math.round(p.fol*.2)},
    offers:[],news:[],job:null,home:pid==='debutant'||pid==='prodige'?0:pid==='inde'?1:pid==='viral'?2:pid==='dechu'?2:3,items:[],team:{},
    livret:0,props:[],stocks:{},prices:{},hist:{},chart:[],feats:[],tour:null,trend:pick(GENRES),gig:-1,lastRel:0,nextBonus:0,
    tot:{streams:0,rev:0,no1:0},yr:{streams:0,best:99,albumQ:0},awards:[],last:null,rest:0,prospects:[],fanHist:[p.fans]};
  ASSETS.forEach(a=>{G.prices[a.id]=100;G.stocks[a.id]={u:0,cost:0};G.hist[a.id]=[100]});
  for(let i=0;i<50;i++)G.chart.push(npcSong(true));
  genFeats();
  G.energy=maxE();
  news(`${name} entre dans le game. Profil : ${p.n}.`);
  save();
}
function npcSong(old){return{title:title(),artist:pick(NPCS),s:250000*Math.exp(rnd(0,old?3.1:3.4)),age:old?ri(0,20):0}}
function genFeats(){G.feats=[2e4,3e5,3e6].map(f=>{const fans=Math.round(f*rnd(.6,1.8));return{name:pick(NPCS),fans,price:Math.round(fans*.07)}})}
function news(txt){G.news.unshift({t:G.t,txt});if(G.news.length>40)G.news.pop()}

/* ============ CALCULS ============ */
const week=()=>G.t%52+1, year=()=>2026+Math.floor(G.t/52);
const followers=()=>G.social.vibe+G.social.pixa+G.social.echo;
const image=()=>G.items.reduce((a,id)=>a+ITEMS.find(i=>i.id===id).im,0)+G.home*2;
const status=()=>[...STATUS].reverse().find(s=>G.fans>=s[0])[1];
const hasProp=n=>G.props.some(p=>PROPS[p.i].n===n);
function maxE(){return Math.max(20,100+HOMES[G.home].e-(G.health<40?20:0)-(G.job!=null?JOBS[G.job].e:0)-(G.tour?30:0))}
function share(){return G.own?1:G.label?G.label.share:.85}
function lmult(){return G.own?1.6+G.skills.marketing/200:G.label?G.label.mult:1}
function netWorth(){let v=G.money+G.livret;ASSETS.forEach(a=>v+=G.stocks[a.id].u*G.prices[a.id]);G.props.forEach(p=>v+=p.val);return v}
const released=()=>G.songs.filter(s=>s.rel!=null), drawer=()=>G.songs.filter(s=>s.rel==null);
function cert(total,th){const n=['Or','Platine','Diamant'];let c=null;th.forEach((x,i)=>{if(total>=x)c=n[i]});return c}
const CS=[15e6,30e6,50e6], CA=[5e4,1e5,5e5];
const certPill=c=>c?`<span class="pill ${c==='Or'?'or':c==='Platine'?'pla':'dia'}">${c}</span>`:'';

/* ============ ACTIONS DE BASE ============ */
let toastT;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)}
function useE(n){if(G.energy<n){toast(`Pas assez d'énergie (il te faut ${n}). Passe à la semaine suivante.`);return false}G.energy-=n;return true}
function canPay(n){if(G.money<n){toast(`Il te manque ${eur(n-G.money)}.`);return false}return true}
function gain(k,n=1){G.skills[k]=clamp(G.skills[k]+n,0,100)}
function addFans(n){G.fans=Math.max(0,Math.round(G.fans+n))}

/* ============ FIN DE SEMAINE ============ */
function endWeek(){
  const R={inc:[],exp:[],streams:0,fans0:G.fans,top:null,certs:[]};
  const inc=(l,v)=>{if(v>=1){R.inc.push([l,v]);G.money+=v}}, exp=(l,v)=>{if(v>=1){R.exp.push([l,v]);G.money-=v}};
  const sh=share(), lm=lmult();
  let stream=0, video=0, fansNew=0;
  // streams
  const nRel=Math.max(1,released().filter(x=>G.t-x.rel<20).length);
  released().forEach(s=>{
    const age=G.t-s.rel, decay=Math.max(.04,Math.pow(.94,age)), q=s.q;
    if(age<8&&!s.viral&&Math.random()<.005+G.skills.viralite/100*.02+(q>60?.01:0)){s.viral=ri(3,5);s.vm=rnd(4,14);news(`🔥 « ${s.title} » explose sur YouTube Shorts !`)}
    let disc=Math.pow(q,2.3)*(.5+G.skills.viralite/100);
    if(s.viral>0){disc*=s.vm*10;s.viral--}
    const fanPart=G.fans*3*Math.pow(q/60,2)/Math.sqrt(nRel);
    let st=(fanPart+disc)*decay*s.hype*lm*(s.genre===G.trend?1.25:1)*(1+(s.fb||0))*rnd(.85,1.15)+(s.ad||0);
    s.ad=0; st=Math.round(st); s.wk=st; s.total+=st; stream+=st;
    fansNew+=st*.006*(q/60)*Math.max(.15,decay);
    if(s.clip){video+=st*.25*(s.clip/60)*.0015}
    s.hype=1+(s.hype-1)*(G.team.presse?.88:.75);
    const c=cert(s.total,CS); if(c&&c!==s.cert){s.cert=c;R.certs.push(`« ${s.title} » certifié single de ${c}`)}
  });
  R.streams=stream; G.tot.streams+=stream; G.yr.streams+=stream;
  let mus=stream*.004*sh; if(G.team.manager)mus*=.9;
  inc('Streaming',mus); inc('Vues des clips',video*sh);
  // albums
  G.albums.forEach(a=>{const st=a.ids.reduce((x,id)=>x+(G.songs.find(s=>s.id===id).wk||0),0);a.units+=st/1500;
    const c=cert(a.units,CA);if(c&&c!==a.cert){a.cert=c;R.certs.push(`L'album « ${a.title} » certifié disque de ${c}`)}});
  // classement
  G.chart.forEach(n=>{n.age++;n.s*=n.age<3?rnd(.95,1.2):rnd(.84,.99)});
  G.chart=G.chart.map(n=>(n.s<200000||Math.random()<.05)?npcSong(false):n);
  const all=[...G.chart.map(n=>({title:n.title,artist:n.artist,s:n.s})),...released().map(s=>({title:s.title,artist:G.name,s:s.wk,me:s.id}))].sort((a,b)=>b.s-a.s).slice(0,50);
  G.top=all;
  released().forEach(s=>{const i=all.findIndex(x=>x.me===s.id);s.pos=i<0?null:i+1;
    if(s.pos){s.weeks=(s.weeks||0)+1;if(!s.peak||s.pos<s.peak){s.peak=s.pos;if(s.pos===1){G.tot.no1++;news(`👑 « ${s.title} » est numéro 1 du Top 50 !`);addFans(G.fans*.04)}else if(s.pos<=10&&s.weeks<3)news(`« ${s.title} » entre dans le top 10 (n°${s.pos}).`)}
      if(!R.top||s.pos<R.top[0])R.top=[s.pos,s.title];G.yr.best=Math.min(G.yr.best,s.pos)}});
  // tournée
  if(G.tour){const T=TOURS[G.tour.i],V=VENUES[T.v];const att=Math.round(Math.min(V.cap,G.fans*.05*(.6+G.skills.charisme/100))*rnd(.85,1));
    inc(`${T.n} (date ${G.tour.done+1}/${T.d})`,att*V.p*.65);fansNew+=att*.06*(1+G.skills.charisme/100);G.health-=2;G.tour.done++;
    if(G.tour.done>=T.d){news(`La ${T.n} est terminée. Standing ovation.`);G.tour=null}}
  // vie
  if(G.job!=null)inc(JOBS[G.job].n,JOBS[G.job].pay);
  exp('Logement',HOMES[G.home].c); exp('Courses et vie quotidienne',60+G.home*40);
  let sal=0;TEAM.forEach(m=>{if(G.team[m.id])sal+=m.w});exp('Salaires de l\'équipe',sal);
  if(G.team.cm)NETS.forEach(n=>G.social[n.id]=Math.round(G.social[n.id]*1.008+40));
  if(G.team.coach&&G.t%2===0)gain(pick(ART));
  // investissements
  let rent=0;G.props.forEach(p=>{rent+=PROPS[p.i].r;p.val*=1+rnd(-.001,.0025)});inc('Loyers',rent);
  if(G.livret>0)G.livret*=1.0006;
  ASSETS.forEach(a=>{G.prices[a.id]=Math.max(1,G.prices[a.id]*(1+a.dr+a.vol*(Math.random()+Math.random()+Math.random()-1.5)*1.15));G.hist[a.id].push(G.prices[a.id]);if(G.hist[a.id].length>30)G.hist[a.id].shift()});
  if(G.own){let li=0;G.own.roster.forEach(a=>{a.pot*=rnd(.94,1.08);li+=a.pot*rnd(.6,1.4)});inc(`Label ${G.own.name}`,li)}
  if(G.money<0){G.health-=3;exp('Agios bancaires',Math.abs(G.money)*.004)}
  // santé
  const used=1-G.energy/maxE();
  G.health+=used>.95?-5:used>.8?-2:3; if(G.home>=3)G.health+=1;
  G.health=clamp(G.health,0,100);
  // fans
  if(G.t-G.lastRel>26&&G.fans>1000){fansNew-=G.fans*.005;if((G.t-G.lastRel)%8===0)news('Tes fans s\'impatientent, ça fait longtemps que tu n\'as rien sorti.')}
  if(fansNew>0)fansNew=Math.min(fansNew,G.fans*.05+3000)*Math.max(0,1-G.fans/8e7);
  addFans(fansNew);
  // temps
  G.t++;
  if(G.t%13===0){const old=G.trend;while(G.trend===old)G.trend=pick(GENRES);news(`Nouvelle tendance : le ${G.trend} domine les playlists ce trimestre.`)}
  if(G.t%4===0)genFeats();
  if(G.t%12===0)G.prospects=[];
  if(week()===50)awards(R);
  if(week()===1){G.age++;G.yr={streams:0,best:99,albumQ:0};news(`Bonne année ${year()} ! Tu as ${G.age} ans.`)}
  G.offers=G.offers.filter(o=>o.exp>G.t); genOffers();
  // burn-out
  let burn=false;
  if(G.health<=10){burn=true;G.health=45;news('Burn-out. Tu passes une semaine au lit, sans rien pouvoir faire.')}
  G.energy=burn?0:maxE(); G.gig=-1;
  R.fans=G.fans-R.fans0; R.burn=burn; G.last=R; G.tot.rev+=R.inc.reduce((a,x)=>a+x[1],0);
  G.fanHist.push(G.fans);if(G.fanHist.length>52)G.fanHist.shift();
  save(); showReport(R);
}
function awards(R){
  const win=[];
  if(!G.awards.some(a=>a.n==='Révélation de l\'année')&&G.fans>=20000&&G.t<160&&Math.random()<.55)win.push('Révélation de l\'année');
  if(G.yr.best<=10&&Math.random()<(G.yr.best===1?.75:.3))win.push('Chanson de l\'année');
  if(G.yr.albumQ>=65&&Math.random()<(G.yr.albumQ-55)/40)win.push('Album de l\'année');
  if(G.yr.streams>15e7&&Math.random()<.5)win.push('Artiste de l\'année');
  win.forEach(n=>{G.awards.push({n,y:year()});news(`🏆 Tu remportes le trophée « ${n} » ${year()} !`)});
  if(win.length){addFans(G.fans*.05*win.length);R.certs.push(...win.map(n=>`Trophée : ${n}`))}
  else news(`Cérémonie des Trophées de la Musique ${year()} : pas de statuette pour toi cette année.`);
}
function genOffers(){
  const mg=G.team.manager?2:1, has=t=>G.offers.some(o=>o.type===t);
  if(!G.label&&!G.own&&!has('label')&&released().length&&Math.random()<.14*mg){
    const tier=G.fans>=LABELS[2].min?2:G.fans>=LABELS[1].min?1:G.fans>=LABELS[0].min?0:-1;
    if(tier>=0){const L=LABELS[tier];G.offers.push({type:'label',tier,name:pick(L.n),share:L.share,mult:L.mult,songs:L.songs,adv:Math.round(Math.max(1500,G.fans*L.adv)*(mg>1?1.15:1)),exp:G.t+4});news('Un label veut te signer. Va voir tes opportunités.')}
  }
  const w=week();
  if(w>=20&&w<=34&&G.fans>=2000&&!has('festival')&&!G.tour&&Math.random()<.22*mg){
    const big=G.fans>1e6?['Les Vieilles Collines','Solidarock','Main Stage Europe']:G.fans>5e4?['Nuits de Fourvière Off','Printemps Sonore','Rock en Rive']:['Fête de la musique','Festival des Pentes','Tremplin Jeunes Talents'];
    G.offers.push({type:'festival',name:pick(big),pay:Math.round(300+G.fans*.12*rnd(.7,1.3)),exp:G.t+3})}
  if(followers()>=15000&&!has('brand')&&Math.random()<.1*mg)
    G.offers.push({type:'brand',name:pick(['une marque de sneakers','une boisson énergisante','une appli de livraison','une marque de casques audio','une maison de luxe','un jeu mobile']),pay:Math.round(followers()*.03*rnd(.5,1.5)*(1+image()/30)*(1+G.skills.nego/200)),exp:G.t+3});
  if(G.fans>=5000&&!has('feat')&&Math.random()<.08*mg)
    G.offers.push({type:'feat',name:pick(NPCS),pay:Math.round(G.fans*.04*rnd(.6,1.4)),exp:G.t+3});
}

 {q:()=>'Un beatmaker inconnu t\'envoie une prod incroyable. Il la donne gratuitement si tu le crédites.',c:[['Accepter',()=>{G.nextBonus=8;return 'Ton prochain son aura +8 de qualité.'}],['Refuser poliment',()=>'Tu restes sur ta direction artistique.']]},

function spark(arr){if(arr.length<2)return'';const mx=Math.max(...arr),mn=Math.min(...arr),w=120,h=30;
  const pts=arr.map((v,i)=>`${(i/(arr.length-1)*w).toFixed(1)},${(h-2-(mx===mn?.5:(v-mn)/(mx-mn))*(h-4)).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linejoin="round"/></svg>`}

  render();
}
/* Everything stays on-device. No API, tracker or remote image requests. */

function portrait(name){
 const h=hash(name),cfg=ARTIST_STYLE[name]||[h%7,['short','curly','long','cap'][h%4],h%3===0?1:0];
 const [tone,hair,beard]=cfg,skin=['#f0cbb5','#e3b89a','#c99c78','#b58362','#a87550','#84583e','#60402e'][tone],bg=['#526554','#6a574e','#53546b','#62684b','#5a7173','#765653'][h%6],cloth=['#d7e89f','#bd9a80','#91a6a4','#393d3c','#afa2c4'][h%5];
 const hc=hair==='blonde'?'#dbc389':hair==='pink'?'#d387ac':'#252521';
 let back=['long','blonde','bangs','curly','pink','pony','locks','bob'].includes(hair)?`<path d="M18 64Q9 8 40 8T63 65Z" fill="${hc}"/>`:'';
 let front=hair==='bald'?'':hair==='cap'?`<path d="M18 27Q16 6 40 9Q59 9 61 26Z" fill="#53624a"/><path d="M18 26h49" stroke="#1e2a20" stroke-width="5"/>`:hair==='locks'?`<path d="M19 28Q18 8 40 10T61 29M20 23L14 50M28 15L25 42M38 14L35 31M49 15L50 38M58 20L65 50" fill="none" stroke="${hc}" stroke-width="6" stroke-linecap="round"/>`:hair==='curly'?`<path d="M17 30Q10 17 20 16Q19 7 30 10Q39 0 46 9Q61 5 61 18Q72 25 62 34L55 23Q39 27 25 24Z" fill="${hc}"/>`:hair==='bangs'||hair==='blonde'||hair==='pink'?`<path d="M18 31Q14 8 40 9T62 31L53 24L47 28L42 22L32 28L25 25Z" fill="${hc}"/>`:`<path d="M19 29Q16 9 40 10T61 29L56 21Q38 28 24 22Z" fill="${hc}"/>`;
 if(hair==='helmet')front='<path d="M15 23Q15 5 40 5T65 23V50H15Z" fill="#b6baaa"/><path d="M18 26H62V43H18Z" fill="#202c2a"/><path d="M23 30H57" stroke="#d6f584" stroke-width="2"/>';
 return `<span class="portrait" role="img" aria-label="Portrait stylisé de ${esc(name)}"><svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg"><rect width="80" height="80" fill="${bg}"/><circle cx="60" cy="15" r="31" fill="#fff" opacity=".05"/>${back}<path d="M5 82Q7 61 30 60H50Q73 62 75 82" fill="${cloth}"/><path d="M31 51v12q9 10 18 0V51" fill="${skin}"/><ellipse cx="40" cy="35" rx="21" ry="25" fill="${skin}"/><path d="M38 33L35 43H42" fill="none" stroke="#503e35" opacity=".35" stroke-width="1.5"/><path d="M25 31h7m16 0h7" stroke="#302923" stroke-width="2" stroke-linecap="round"/><circle cx="29" cy="35" r="1.4" fill="#292724"/><circle cx="51" cy="35" r="1.4" fill="#292724"/><path d="M34 49q6 3 12 0" fill="none" stroke="#704d40" stroke-width="1.5"/>${beard?'<path d="M20 41Q24 63 40 62Q57 63 60 41L52 48L48 46L40 48L33 46L27 48Z" fill="#272622" opacity=".9"/>':''}${front}${['SCH','DJ Snake','Bad Bunny'].includes(name)?'<path d="M20 32h16v10H22Zm24 0h16l-2 10H44Z" fill="#202925"/><path d="M36 35h8" stroke="#202925" stroke-width="2"/>':''}</svg></span>`;
}
function stageArt(){return `<svg class="stage-svg" viewBox="0 0 540 380" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="beam" x2="0" y2="1"><stop stop-color="#d6f584" stop-opacity=".45"/><stop offset="1" stop-color="#d6f584" stop-opacity="0"/></linearGradient><radialGradient id="glow"><stop stop-color="#d6f584" stop-opacity=".2"/><stop offset="1" stop-color="#d6f584" stop-opacity="0"/></radialGradient></defs><circle cx="280" cy="180" r="230" fill="url(#glow)"/><g fill="none" stroke="#d6f584" opacity=".16"><circle cx="295" cy="175" r="100"/><circle cx="295" cy="175" r="140"/><circle cx="295" cy="175" r="180"/><path d="M0 290H540M0 310H540M0 330H540"/></g><path d="M135 0L25 360H440Z" fill="url(#beam)" opacity=".55"/><path d="M430 0L135 360H540Z" fill="url(#beam)" opacity=".7"/><g transform="rotate(21 292 180)"><rect x="255" y="64" width="69" height="129" rx="33" fill="#26362c" stroke="#a7b775" stroke-width="2"/><path d="M265 89h49m-53 12h58m-59 12h61m-61 12h61m-61 12h61m-61 12h61m-59 12h57m-52 12h46" stroke="#b6c389" opacity=".6" stroke-width="3"/><path d="M244 145v20q0 51 46 51t46-51v-20" fill="none" stroke="#d5dfad" stroke-width="7"/><path d="M290 217v104m-39 0h78" stroke="#b4c48b" stroke-width="6"/><path d="M290 321Q280 370 390 355T480 390" stroke="#a4b080" stroke-width="3" fill="none"/></g><g fill="#d6f584"><circle cx="105" cy="105" r="2"/><circle cx="410" cy="120" r="2"/><circle cx="170" cy="225" r="1"/><circle cx="457" cy="238" r="1.5"/><circle cx="350" cy="40" r="1.5"/></g><g fill="#101b16" opacity=".7"><path d="M0 380v-38q12-20 24 0v38m4 0v-51q12-20 24 0v51m4 0v-25q12-20 24 0v25m4 0v-33q12-20 24 0v33m4 0v-50q12-20 24 0v50m4 0v-20q12-20 24 0v20m4 0v-37q12-20 24 0v37m4 0v-47q12-20 24 0v47m4 0v-30q12-20 24 0v30"/></g></svg>`}
const netIcon=n=>({echo:'𝕏',pixa:'◎',vibe:'▷'})[n];
function ensureSocial(){
 if(!Array.isArray(G.posts))G.posts=[];
 if(!G.reactions||typeof G.reactions!=='object')G.reactions={};
 if(!G.comments||typeof G.comments!=='object')G.comments={};
}
const POST_TEXT=[

 'Le moment où toute la salle chante plus fort que toi… c’est pour ça qu’on fait ce métier.',
 'La musique avant les chiffres. Toujours.',
 'Vous écoutez quoi en boucle en ce moment ? Je prends les recommandations 👀',

 'Les coulisses sont parfois plus belles que le show. Merci à toute l’équipe ✨',
 'Un casque, une prod et plus aucune notion du temps. Vous connaissez.',
 'Le prochain projet est différent. Hâte de vous emmener dans cet univers.',
 'Petit rappel : soutenez aussi les artistes qui commencent. On a tous eu un premier son.',

 'La meilleure place du monde : derrière le rideau, dix secondes avant de monter sur scène.'
];
function robotFeed(){
 const out=[];for(const n of NETS){for(let i=0;i<10;i++){
 const h=hash(`${G.t}-${n.id}-${i}`),artist=NPCS[(h+i*7)%NPCS.length];
 out.push({id:`bot-${G.t}-${n.id}-${i}`,artist,net:n.id,text:POST_TEXT[(h+i)%POST_TEXT.length],likes:500+h%42000,time:`il y a ${1+i*2} h`,art:i%4===1,t:G.t});
 }}return out;
}
function postCard(p){
 const liked=!!G.reactions[p.id],comments=G.comments[p.id]||[];
 return `<article class="card post"><div class="row">${portrait(p.artist)}<div class="grow"><b>${esc(p.artist)}</b>${p.own?'':'<span class="verified" aria-label="Artiste">✦</span>'}<div class="small muted">${esc(p.time||'À l’instant')} · ${p.own?'Ton post':'Post simulé'}</div></div><span class="post-badge">${netIcon(p.net)}</span></div><p class="post-body">${esc(p.text)}</p>${p.art?`<div class="post-art">${portrait(p.artist)}<span>STUDIO<br>DIARIES.</span></div>`:''}<div class="post-actions"><button class="${liked?'liked':''}" data-a="like" data-v="${esc(p.id)}" aria-label="Aimer le post de ${esc(p.artist)}" aria-pressed="${liked}">${liked?'♥':'♡'} ${fmt((p.likes||0)+(liked?1:0))}</button><button data-a="commentform" data-v="${esc(p.id)}">☏ ${comments.length} commentaire${comments.length===1?'':'s'}</button></div>${comments.map(c=>`<div class="comment"><b>${esc(c.author)}</b> ${esc(c.text)}</div>`).join('')}</article>`;
}
function artistDirectory(){
 return subs('charts',[['top','Top 50'],['certs','Certifications'],['palm','Palmarès'],['artists','Artistes']])+`<div class="section-title"><div><h2>Le monde ne t’attend pas.</h2><p class="small muted">${NPCS.length} artistes · scènes française et internationale</p></div></div><label class="f">Rechercher un artiste<input class="directory-search" type="text" id="artist-search" placeholder="Un nom, une inspiration…"></label><div class="directory-grid">${NPCS.map((n,i)=>`<div class="artist-card" data-artist="${esc(n.toLowerCase())}">${portrait(n)}<b>${esc(n)}</b><span class="small muted">${i<40?'Scène francophone':'Scène internationale'}</span></div>`).join('')}</div><p class="muted small" id="artist-empty" hidden>Aucun artiste trouvé.</p><p class="simulation-note">Noms réels, portraits vectoriels stylisés. Les collaborations, publications et classements sont inventés dans cet univers de jeu.</p>`;
}
A.net=v=>{socialNet=v};
A.publish=()=>{
 const el=document.getElementById('post-text'),text=el.value.trim();
 if(!text){toast('Écris quelque chose avant de publier.');return true}
 if(!useE(5))return true;
 const f=G.social[socialNet],g=Math.round(rnd(10,30)*(1+(G.skills.charisme+G.skills.viralite)/60)*(1+image()/25)+f*rnd(.004,.012));
 G.social[socialNet]+=g;addFans(g*.25);
 G.posts.unshift({id:'own-'+Date.now()+'-'+G.posts.length,artist:G.name,net:socialNet,text:text.slice(0,280),own:true,likes:Math.round(g*rnd(.2,.8)),t:G.t,time:`S${week()} · ${year()}`});
 G.posts=G.posts.slice(0,100);toast(`Publié sur ${NETS.find(n=>n.id===socialNet).n} · +${fmt(g)} abonnés`);
};
A.like=id=>{G.reactions[id]=!G.reactions[id]};
A.commentform=id=>{modal(`<h2>Répondre au post</h2><label class="f" for="comment-text">Ton commentaire<input type="text" id="comment-text" maxlength="180" placeholder="Rejoins la conversation…"></label><div class="row"><button class="btn pri" data-a="comment" data-v="${esc(id)}">Répondre</button><button class="btn" data-a="close">Annuler</button></div>`);return true};
A.comment=id=>{const text=document.getElementById('comment-text').value.trim();if(!text){toast('Écris ton commentaire.');return true}if(!G.comments[id])G.comments[id]=[];G.comments[id].push({author:G.name,text:text.slice(0,180)});G.comments[id]=G.comments[id].slice(-20);closeModal()};
A.settings=()=>{modal(`<h2>Ta carrière, à emporter.</h2><p class="small muted">La sauvegarde est automatique sur cet appareil. Exporte une copie pour changer de navigateur ou conserver ta progression.</p><button class="btn pri" data-a="export">↓ Exporter ma sauvegarde</button><label class="f" for="save-file">Importer une sauvegarde JSON<input type="file" id="save-file" accept="application/json,.json"></label><p class="small muted">L’import remplace la carrière de ce navigateur après validation.</p><div class="row"><button class="btn" data-a="close">Fermer</button><button class="btn ghost" data-a="resetform">Nouvelle carrière</button></div><p class="simulation-note">BACKSTAGE · Simulation locale. Aucun achat réel, aucun accès aux réseaux sociaux.</p>`);return true};
A.export=()=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify({backstage:2,G},null,2)],{type:'application/json'}));a.href=url;a.download='backstage-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Sauvegarde exportée.');return true};
document.addEventListener('input',e=>{
 if(e.target.id==='artist-search'){
 const q=e.target.value.toLocaleLowerCase('fr').trim();let shown=0;
 document.querySelectorAll('[data-artist]').forEach(el=>{el.hidden=!el.dataset.artist.includes(q);if(!el.hidden)shown++});
 document.getElementById('artist-empty').hidden=!!shown;
 }
});
document.addEventListener('change',async e=>{
 if(e.target.id!=='save-file'||!e.target.files?.length)return;
 const file=e.target.files[0];
 try{
 if(file.size>2e6)throw Error('Fichier trop volumineux.');
 const data=JSON.parse(await file.text()),candidate=data.G;
 validateSave(candidate);pendingImport=candidate;
 modal(`<h2>Reprendre cette carrière ?</h2><p><b>${esc(candidate.name)}</b> · semaine ${candidate.t+1}<br>La carrière de ce navigateur sera remplacée.</p><div class="row"><button class="btn pri" data-a="importconfirm">Importer</button><button class="btn" data-a="close">Annuler</button></div>`);
 }catch(err){toast('Import refusé : '+err.message)}
});
let pendingImport=null;
function validateSave(g){
 if(!g||g.v!==1||typeof g.name!=='string'||!g.name.trim()||g.name.length>22||!Number.isInteger(g.t)||g.t<0||!GENRES.includes(g.genre))throw Error('Sauvegarde non reconnue.');
 for(const k of ['money','fans','energy','health','livret','nid'])if(typeof g[k]!=='number'||!Number.isFinite(g[k]))throw Error('Valeurs invalides.');
 if(!Number.isInteger(g.home)||!HOMES[g.home]||g.job!==null&&!JOBS[g.job])throw Error('Profil invalide.');
 if(!g.skills||!Object.keys(SK).every(k=>Number.isFinite(g.skills[k])&&g.skills[k]>=0&&g.skills[k]<=100))throw Error('Compétences invalides.');
 for(const k of ['songs','albums','chart','feats','items','props','offers','news','fanHist','awards','prospects'])if(!Array.isArray(g[k]))throw Error('Données incomplètes.');
 if(!g.social||!NETS.every(n=>Number.isFinite(g.social[n.id])&&g.social[n.id]>=0))throw Error('Réseaux invalides.');
 if(!g.team||!g.tot||!g.yr||!g.stocks||!g.prices||!g.hist||!ASSETS.every(a=>g.stocks[a.id]&&Number.isFinite(g.stocks[a.id].u)&&Number.isFinite(g.stocks[a.id].cost)&&Number.isFinite(g.prices[a.id])&&Array.isArray(g.hist[a.id])))throw Error('Finances invalides.');
 if(g.items.some(id=>!ITEMS.some(x=>x.id===id))||g.props.some(p=>!PROPS[p.i]||!Number.isFinite(p.val)))throw Error('Inventaire invalide.');
 if(g.songs.some(s=>typeof s.title!=='string'||!Number.isFinite(s.q)||!Number.isFinite(s.total)||!Number.isInteger(s.id))||g.chart.some(c=>typeof c.title!=='string'||typeof c.artist!=='string'||!Number.isFinite(c.s)))throw Error('Catalogue invalide.');
 if(g.albums.some(a=>!Array.isArray(a.ids)||a.ids.some(id=>!g.songs.some(s=>s.id===id))))throw Error('Albums invalides.');
 if(g.tour&&(!TOURS[g.tour.i]||!Number.isFinite(g.tour.done)))throw Error('Tournée invalide.');
 if(g.posts&&(!Array.isArray(g.posts)||g.posts.some(p=>typeof p.text!=='string'||typeof p.artist!=='string'||!NETS.some(n=>n.id===p.net))))throw Error('Posts invalides.');
 if(g.posts&&g.posts.some(p=>typeof p.id!=='string'||!/^own-[a-zA-Z0-9-]+$/.test(p.id)||p.text.length>280||p.artist.length>80||!Number.isFinite(p.likes)))throw Error('Posts invalides.');
 if(g.reactions&&(typeof g.reactions!=='object'||Array.isArray(g.reactions)))throw Error('Réactions invalides.');
 if(g.comments){if(typeof g.comments!=='object'||Array.isArray(g.comments)||Object.values(g.comments).some(a=>!Array.isArray(a)||a.some(c=>typeof c.author!=='string'||typeof c.text!=='string'||c.text.length>180)))throw Error('Commentaires invalides.');}
 if(g.news.some(n=>!Number.isFinite(n.t)||typeof n.txt!=='string'))throw Error('Journal invalide.');
 return g;
}
A.importconfirm=()=>{if(!pendingImport)return;G=pendingImport;pendingImport=null;ensureSocial();tab='home';closeModal();toast('Carrière importée.')};
// Keep focus in dialogs and restore it on close. Avoid keyboard zoom on iPhone.
let modalFocus=null;
const originalModal=modal,originalClose=closeModal;
modal=function(html,lock){modalFocus=document.activeElement;originalModal(html,lock);requestAnimationFrame(()=>document.querySelector('.modal input:not([type=checkbox]),.modal button')?.focus())};
closeModal=function(){originalClose();if(modalFocus?.isConnected)modalFocus.focus()};
document.addEventListener('keydown',e=>{
 const v=document.getElementById('veil');if(!v)return;
 if(e.key==='Escape'&&v.dataset.a==='close'){A.close();return}
 if(e.key==='Tab'){
 const els=[...v.querySelectorAll('button:not(:disabled),input,select,textarea,[tabindex="0"]')];
 if(!els.length)return;
 const first=els[0],last=els[els.length-1];
 if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
 else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
 }
});
// Discard stale bot interactions; user posts remain. Keep saves small on mobile.
const oldEndWeek=endWeek;
endWeek=function(){oldEndWeek();ensureSocial();const ids=new Set(G.posts.map(p=>p.id));for(const k of Object.keys(G.reactions))if(!ids.has(k)&&!k.startsWith('bot-'+G.t+'-'))delete G.reactions[k];for(const k of Object.keys(G.comments))if(!ids.has(k)&&!k.startsWith('bot-'+G.t+'-'))delete G.comments[k];save()};

start();
</script>
