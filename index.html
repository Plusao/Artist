<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Backstage">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#070c0b">
<title>Backstage</title>
<style>
:root{
  /* Coque d'app : #app est la seule zone qui défile, barre et onglets en verre flottent par-dessus. */
  color-scheme:dark;
  --bg:#070c0b;--ink:#f6f8f3;--ink2:rgba(246,248,243,.68);--ink3:rgba(246,248,243,.42);
  --acc:#d6f584;--acc-ink:#142006;
  --blue:#78c3ff;--pink:#ff8db8;--violet:#b7a2ff;--warn:#ffbe6b;--good:#8ff0b2;--bad:#ff7d8c;--gold:#f5d37a;
  --stroke:rgba(255,255,255,.14);--fill:rgba(255,255,255,.07);--fill2:rgba(255,255,255,.12);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.22,1,.36,1);--p:0;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%;background:var(--bg);touch-action:manipulation;-webkit-text-size-adjust:100%}
body{font:15px/1.4 var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
img,svg{-webkit-user-drag:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}.dim{color:var(--ink3)}.small{font-size:13px}.xs{font-size:11.5px}.good{color:var(--good)}.bad{color:var(--bad)}.gold{color:var(--gold)}.acc{color:var(--acc)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[hidden]{display:none!important}

/* fond : calque statique, jamais repeint au scroll */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(60% 40% at 92% 4%,rgba(214,245,132,.17),transparent 70%),
  radial-gradient(70% 45% at 0% 40%,rgba(80,200,185,.14),transparent 70%),
  radial-gradient(70% 45% at 90% 100%,rgba(150,120,255,.15),transparent 70%),var(--bg);transform:translateZ(0)}

/* zone qui défile */
#app{position:fixed;inset:0;z-index:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;scrollbar-width:none;transform:translateZ(0)}
#app::-webkit-scrollbar{display:none}
#view{max-width:640px;margin:0 auto;padding:calc(var(--sat) + 84px) 16px calc(var(--sab) + 120px);display:flex;flex-direction:column;gap:16px;min-height:101%}
body.welcome #view{padding-top:calc(var(--sat) + 24px);padding-bottom:calc(var(--sab) + 32px)}

/* verre */
.glass{position:relative;background:linear-gradient(160deg,rgba(255,255,255,.15),rgba(255,255,255,.05) 55%,rgba(255,255,255,.09));-webkit-backdrop-filter:blur(28px) saturate(190%);backdrop-filter:blur(28px) saturate(190%);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(255,255,255,.04),0 10px 34px rgba(0,0,0,.35)}
.glass::after,.card::after,.btn::after{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:linear-gradient(145deg,rgba(255,255,255,.55),rgba(255,255,255,.05) 30%,rgba(255,255,255,.03) 70%,rgba(255,255,255,.26));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:rgba(28,36,33,.94)}}

/* barre du haut */
#bar{position:fixed;top:0;left:0;right:0;z-index:40;padding:calc(var(--sat) + 8px) 12px 0;pointer-events:none}
.bar-in{pointer-events:auto;max-width:616px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:9px 10px 9px 16px;border-radius:28px;min-height:58px}
.hud{flex:1;min-width:0}
.money{font-size:19px;font-weight:700;letter-spacing:-.4px;line-height:1.1}
.ebar{position:relative;height:5px;margin:6px 0 4px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
.ebar i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:linear-gradient(90deg,#9ad54a,var(--acc));transition:width .5s var(--ease)}
.ebar u{position:absolute;right:0;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(255,190,107,.9) 0 3px,transparent 3px 6px);border-radius:0 9px 9px 0}
.hud small{font-size:11px;color:var(--ink2);display:block;white-space:nowrap}
.itl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-weight:700;font-size:15px;opacity:calc(var(--p));pointer-events:none;max-width:34%;text-align:center}
.next{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-height:42px;padding:0 16px;border-radius:999px;font-weight:700;font-size:13px;background:linear-gradient(180deg,#e9ffa8,#c3ec66);color:var(--acc-ink);box-shadow:0 6px 18px rgba(214,245,132,.28),inset 0 1px 0 rgba(255,255,255,.8);transition:transform .25s var(--ease)}
.next:active{transform:scale(.95)}.next small{font-size:10.5px;font-weight:600;opacity:.7}

/* onglets */
#tabs{position:fixed;left:0;right:0;bottom:calc(var(--sab) + 10px);z-index:40;display:flex;gap:10px;justify-content:center;padding:0 14px;pointer-events:none}
.tabbar{pointer-events:auto;display:flex;flex:1;max-width:400px;padding:6px;border-radius:32px;transition:transform .4s var(--ease)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0 6px;border-radius:26px;color:var(--ink2);font-size:10px;font-weight:600;transition:background .3s,color .3s}
.tabbar button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button span{max-height:14px;overflow:hidden;transition:opacity .25s,max-height .3s var(--ease)}
.tabbar button.on{background:rgba(255,255,255,.15);color:var(--acc);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.fab{pointer-events:auto;flex:none;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;color:var(--acc);transition:transform .3s var(--ease)}
.fab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.fab:active{transform:scale(.92)}
body.min .tabbar{transform:translateY(8px) scale(.93)}
body.min .tabbar button span{opacity:0;max-height:0}

/* gros titre qui se replie */
.lt{padding:2px 4px 0;opacity:calc(1 - var(--p));transform:translateY(calc(var(--p) * -6px))}
.lt p{font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink3)}
.lt h1{font-size:34px;font-weight:800;letter-spacing:-.9px;line-height:1.1}

/* cartes et listes */
.card{position:relative;border-radius:26px;padding:16px;background:linear-gradient(170deg,rgba(255,255,255,.09),rgba(255,255,255,.035));box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 8px 26px rgba(0,0,0,.28);display:flex;flex-direction:column;gap:12px}
.card h3{font-size:13px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--ink3)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:6px 4px 0}
.sec h2{font-size:21px;font-weight:700;letter-spacing:-.4px}
.link{color:var(--acc);font-size:14px;font-weight:600;padding:6px 2px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row>.grow,.grow{flex:1;min-width:0}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid rgba(255,255,255,.08)}
.lrow:first-child{border-top:0;padding-top:2px}.lrow:last-child{padding-bottom:2px}
.lrow b{font-weight:600}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--ink3);line-height:1.5}

/* boutons */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 18px;border-radius:999px;font-weight:600;font-size:14px;background:var(--fill2);white-space:nowrap;transition:transform .25s var(--ease),background .2s}
.btn:active{transform:scale(.95)}
.btn.pri{background:linear-gradient(180deg,#e9ffa8,#c3ec66);color:var(--acc-ink);box-shadow:0 6px 18px rgba(214,245,132,.25),inset 0 1px 0 rgba(255,255,255,.8)}
.btn.pri::after{display:none}
.btn.sm{min-height:36px;padding:0 14px;font-size:13px}
.btn.ghost{background:transparent}.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.36;pointer-events:none}
.cost{font-size:12px;color:var(--ink3);white-space:nowrap}.cost b{color:var(--warn);font-weight:700}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--fill2);color:var(--ink2);white-space:nowrap}
.pill.hot{background:rgba(214,245,132,.16);color:var(--acc)}.pill.ok{background:rgba(143,240,178,.15);color:var(--good)}
.pill.or{background:rgba(245,211,122,.18);color:var(--gold)}.pill.pla{background:rgba(220,230,245,.18);color:#dfe6f5}.pill.dia{background:rgba(130,220,255,.18);color:#9fe6ff}
.pill.red{background:rgba(255,125,140,.16);color:var(--bad)}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:inherit}

/* champs (16px minimum : pas de zoom iOS) */
input[type=text],input[type=search],select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--stroke);border-radius:16px;padding:13px 14px;outline:none;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{border-color:rgba(214,245,132,.7);box-shadow:0 0 0 3px rgba(214,245,132,.15)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
select option{background:#1b2420;color:var(--ink)}
textarea{resize:none;min-height:84px;line-height:1.5}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink2)}
input[type=file]{font-size:14px;max-width:100%;color:var(--ink2)}
.check{display:flex;align-items:center;gap:10px;padding:8px 0}
.check input{width:22px;height:22px;accent-color:#c3ec66;flex:none}

/* segmenté collant */
.segw{position:sticky;top:calc(var(--sat) + 76px);z-index:20;margin:-4px 0}
.seg{display:flex;gap:2px;padding:4px;border-radius:24px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;padding:9px 14px;border-radius:20px;font-weight:600;font-size:13.5px;color:var(--ink2);white-space:nowrap;transition:background .3s,color .3s}
.seg button.on{background:rgba(255,255,255,.17);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 8px rgba(0,0,0,.25)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chips button{min-height:38px;padding:0 14px;border-radius:99px;background:var(--fill);border:1px solid var(--stroke);font-weight:600;font-size:13.5px;transition:background .25s,transform .25s var(--ease)}
.chips button:active{transform:scale(.95)}
.chips button.on{background:rgba(214,245,132,.2);border-color:rgba(214,245,132,.6);color:var(--acc)}
.chips button[disabled]{opacity:.35}

/* pochettes et portraits */
.cover{display:inline-flex;align-items:center;justify-content:center;flex:none;border-radius:12px;overflow:hidden;position:relative;color:rgba(255,255,255,.9);font-weight:800;letter-spacing:-.5px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover b{font-size:.34em;position:relative}
.portrait{display:inline-block;border-radius:50%;overflow:hidden;flex:none;vertical-align:middle;border:1px solid rgba(255,255,255,.18)}
.portrait svg{display:block;width:100%;height:100%}

/* accueil */
.hero{border-radius:34px;padding:22px;min-height:236px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;overflow:hidden}
.hero .art{position:absolute;inset:0;opacity:.8;pointer-events:none}
.hero .art svg{width:100%;height:100%;object-fit:cover}
.hero>*:not(.art){position:relative;z-index:1}
.hero h2{font-size:38px;font-weight:800;letter-spacing:-1.2px;line-height:1.02;overflow-wrap:anywhere}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.metric{padding:16px;border-radius:24px;display:flex;flex-direction:column;gap:4px;min-width:0}
.metric span{font-size:11.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink3)}
.metric b{font-size:26px;font-weight:700;letter-spacing:-.6px;line-height:1.1}
.metric small{font-size:12px;color:var(--ink2)}
.agenda{display:flex;flex-direction:column}
.arow{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid rgba(255,255,255,.08)}
.arow:first-child{border-top:0}
.adate{width:46px;flex:none;text-align:center}.adate b{display:block;font-size:19px;font-weight:700;line-height:1}.adate small{font-size:10.5px;color:var(--ink3);font-weight:600;text-transform:uppercase}
.aico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:16px;background:rgba(214,245,132,.14);color:var(--acc);flex:none}
.aico.c2{background:rgba(255,141,184,.15);color:var(--pink)}.aico.c3{background:rgba(120,195,255,.15);color:var(--blue)}.aico.c4{background:rgba(183,162,255,.16);color:var(--violet)}.aico.c5{background:rgba(255,190,107,.16);color:var(--warn)}

/* défilement horizontal */
.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start;flex:none}
.rel{width:132px;display:flex;flex-direction:column;gap:6px}.rel b{font-size:13.5px;font-weight:600}.rel small{font-size:11.5px;color:var(--ink2)}
.vid{width:232px;display:flex;flex-direction:column;gap:7px}
.thumb{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;display:grid;place-items:center}
.thumb .portrait{width:56px;height:56px;border-width:2px}
.thumb .play{position:absolute;right:10px;bottom:10px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;font-size:11px}
.thumb .dur{position:absolute;left:10px;bottom:10px;font-size:10.5px;font-weight:700;background:rgba(0,0,0,.6);padding:2px 6px;border-radius:6px}

/* stories */
.stories{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;margin:0 -16px;padding:4px 16px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.stories::-webkit-scrollbar{display:none}
.story{flex:none;width:68px;text-align:center;scroll-snap-align:start;font-size:11.5px;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:6px}
.ring{padding:3px;border-radius:50%;background:conic-gradient(from 200deg,#ffe36e,#ff7a59,#ff3d8f,#b04cff,#ffe36e);position:relative}
.ring.seen{background:rgba(255,255,255,.22)}
.ring .portrait{border:3px solid #0a100f;display:block}
.ring .add{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:var(--acc);color:var(--acc-ink);font-weight:800;display:grid;place-items:center;border:2px solid #0a100f;font-size:15px;line-height:1}
#sv{position:fixed;inset:0;z-index:130;background:#000;display:flex;flex-direction:column;animation:fadein .25s}
@keyframes fadein{from{opacity:0}}
.sv-bars{display:flex;gap:4px;padding:calc(var(--sat) + 10px) 12px 8px;position:relative;z-index:3}
.sv-bars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden;position:relative}
.sv-bars i b{position:absolute;inset:0;background:#fff;transform:scaleX(0);transform-origin:left}
.sv-bars i.done b{transform:none}
.sv-bars i.cur b{animation:fill var(--d,4.5s) linear forwards}
@keyframes fill{to{transform:none}}
.sv-head{display:flex;align-items:center;gap:10px;padding:0 14px 8px;z-index:3;position:relative}
.sv-body{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:100px 28px;text-align:center;gap:18px}
.sv-body p{font-size:27px;font-weight:800;letter-spacing:-.6px;line-height:1.2;text-wrap:balance;text-shadow:0 2px 20px rgba(0,0,0,.35)}
.sv-body img{max-width:78%;max-height:50%;border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.sv-tap{position:absolute;inset:0;display:flex;z-index:2}.sv-tap div{flex:1}.sv-tap div:first-child{flex:.4}.sv-tap div:last-child{flex:.6}
.sv-x{margin-left:auto;font-size:26px;padding:4px 8px;color:#fff}

/* classements */
.crow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid rgba(255,255,255,.07)}
.crow:first-child{border-top:0}
.rk{width:30px;text-align:center;font-weight:800;font-size:17px;flex:none}
.rk small{display:block;font-size:10px;font-weight:700;line-height:1}
.crow.me{margin:0 -10px;padding:10px;border-radius:16px;background:rgba(214,245,132,.12);border-top-color:transparent}
.crow.me .rk{color:var(--acc)}

/* compétences */
.skill{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid rgba(255,255,255,.07)}
.skill:first-of-type{border-top:0}
.skill .lv{font-size:24px;font-weight:800;color:var(--acc);letter-spacing:-.5px}

/* réseaux */
.post{display:flex;flex-direction:column;gap:10px}
.post p{font-size:14.5px;line-height:1.5;overflow-wrap:anywhere;white-space:pre-wrap}
.post img{width:100%;border-radius:18px;display:block;max-height:380px;object-fit:cover}
.pa{display:flex;gap:22px;color:var(--ink2);font-size:13px}.pa button{display:flex;gap:6px;align-items:center;min-height:36px}
.pa button.liked{color:var(--pink)}
.cm{padding:9px 12px;border-radius:14px;background:rgba(255,255,255,.06);font-size:13px;color:var(--ink2)}
.nlogo{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none}
.nlogo svg{width:20px;height:20px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{padding:12px;border-radius:18px;background:rgba(255,255,255,.06);display:flex;flex-direction:column;gap:2px}
.tile span{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--ink3)}.tile b{font-size:20px;font-weight:700;letter-spacing:-.4px}.tile small{font-size:11.5px;color:var(--ink2)}
.spark{display:block;width:100%;height:46px}
.acard{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border-radius:22px;background:rgba(255,255,255,.055);text-align:center;min-width:0;content-visibility:auto;contain-intrinsic-size:auto 150px}
.acard b{font-size:13px;font-weight:600;line-height:1.2;width:100%}.acard small{font-size:11px;color:var(--ink2)}
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* sheets */
.scrim{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.46);opacity:0;transition:opacity .35s}.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:91;max-width:640px;margin:0 auto;max-height:92dvh;display:flex;flex-direction:column;border-radius:36px 36px 0 0;transform:translateY(105%);transition:transform .5s var(--ease);will-change:transform;background:linear-gradient(170deg,rgba(40,50,46,.78),rgba(18,24,22,.86));-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 -20px 60px rgba(0,0,0,.5)}
.sheet::after{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,.04) 40%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.sheet.on{transform:none}.sheet.drag{transition:none}

/* ============ NPC : charts et sorties réelles-ish ============ */
const decayOf=(n,age)=>n.base*Math.pow(n.ev?.985:.87,age);
function npcSongNew(){const a=wpick(),album=Math.random()<.18,hit=Math.random()<.12?1.7:1,base=a.w*rnd(.55,1.45)*hit*(album?1.1:1);return{title:titleFor(a),artist:a.n,base,age:0,s:base,ev:Math.random()<.1,album,fr:a.fr}}
function initChart(){const ch=[],cnt={};let g=0;while(ch.length<62&&g++<6000){const n=npcSongNew();n.age=ri(0,24);n.s=decayOf(n,n.age)*rnd(.93,1.07);if(n.s<THR||(cnt[n.artist]||0)>=4)continue;cnt[n.artist]=(cnt[n.artist]||0)+1;ch.push(n)}return ch}
function npcRelease(silent){
  const n=npcSongNew(),k=n.album?'album':'single';
  if(n.base>=THR&&G.chart.filter(x=>x.artist===n.artist).length<4)G.chart.push(n);
  G.feed.unshift({id:'f'+G.t+'-'+G.feed.length+'-'+ri(0,999),artist:n.artist,title:n.title,kind:k,t:G.t,n:Math.round(n.base),fr:n.fr});
  if(Math.random()<.5)G.feed.unshift({id:'c'+G.t+'-'+G.feed.length+'-'+ri(0,999),artist:n.artist,title:n.title,kind:'clip',t:G.t,n:Math.round(n.base*rnd(1.2,2.2)),fr:n.fr});
  if(G.feed.length>44)G.feed.length=44;
}
function rollStoryArtists(){const s=new Set();let g=0;while(s.size<14&&g++<200)s.add(wpick().n);G.storyArtists=[...s]}
function genFeats(){
  const f=Math.max(G.fans,300),mk=(ml,name)=>({name,ml,price:Math.max(150,Math.round(ml*1e6*.006))});
  G.feats=[mk(Math.max(.002,f*rnd(.5,1.4)/1e6),pick(TALENT))];
  const a2=nearestArtist(Math.max(.8,f*rnd(3,7)/1e6)),a3=nearestArtist(Math.max(4,f*rnd(15,40)/1e6));
  [a2,a3].forEach(a=>{if(!G.feats.some(x=>x.name===a.n))G.feats.push(mk(a.ml,a.n))});
}
function rankChart(){
  G.chart.forEach(n=>{n.prk=n.rk;n.rk=null});
  const rec=released(),all=[...G.chart.map(n=>({title:n.title,artist:n.artist,s:n.s,prev:n.prk,ref:n})),...rec.map(s=>({title:s.title,artist:G.name,s:s.wk||0,me:s.id,prev:s.pos}))].sort((a,b)=>b.s-a.s).slice(0,50);
  all.forEach((x,i)=>{x.rk=i+1;if(x.ref)x.ref.rk=i+1});
  G.top=all.map(x=>({title:x.title,artist:x.artist,s:x.s,me:x.me,prev:x.prev,rk:x.rk}));
}

/* ============ CALCULS ============ */
const week=()=>G.t%52+1,year=()=>2026+Math.floor(G.t/52);
const followers=()=>G.social.ig+G.social.yt+G.social.x;
const image=()=>G.items.reduce((a,id)=>a+ITEMS.find(i=>i.id===id).im,0)+G.home*2;
const status=()=>[...STATUS].reverse().find(s=>G.fans>=s[0])[1];
const hasProp=n=>G.props.some(p=>PROPS[p.i].n===n);
const released=()=>G.songs.filter(s=>s.rel!=null&&s.rel<=G.t),sched=()=>G.songs.filter(s=>s.rel!=null&&s.rel>G.t),drawer=()=>G.songs.filter(s=>s.rel==null);
function maxE(){return Math.max(30,100+HOMES[G.home].e-(G.job!=null?JOBS[G.job].e:0)-(G.health<40?20:0))}
function tourAt(t){return G.tour&&t>=G.tour.start&&t<G.tour.start+TOURS[G.tour.i].d}
function resAt(t){let r=tourAt(t)?30:0;G.cal.forEach(e=>{if(e.t===t)r+=e.e});return r}
const busy=t=>G.cal.some(e=>e.t===t)||tourAt(t);
function share(){return G.own?1:G.label?G.label.share:.85}
function lmult(){return G.own?1.6+G.skills.marketing/200:G.label?G.label.mult:1}
function netWorth(){let v=G.money+G.livret;ASSETS.forEach(a=>v+=G.stocks[a.id].u*G.prices[a.id]);G.props.forEach(p=>v+=p.val);return v}
function cert(total,th){const n=['Or','Platine','Diamant'];let c=null;th.forEach((x,i)=>{if(total>=x)c=n[i]});return c}
const CS=[1e7,25e6,5e7],CA=[3e4,1e5,5e5];
const certPill=c=>c?`<span class="pill ${c==='Or'?'or':c==='Platine'?'pla':'dia'}">${c}</span>`:'';
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2800)}
function useE(n){if(G.energy<n){toast(`Pas assez d'énergie (il te faut ${n}). Passe à la semaine suivante.`);return false}G.energy-=n;return true}
function canPay(n){if(G.money<n){toast(`Il te manque ${eur(n-G.money)}.`);return false}return true}
function gain(k,n=1){G.skills[k]=clamp(G.skills[k]+n,0,100)}
function addFans(n){G.fans=Math.max(0,Math.round(G.fans+n))}
function news(txt){G.news.unshift({t:G.t,txt});if(G.news.length>40)G.news.pop()}
const inc=(l,v)=>{if(v>=1){CUR.inc.push([l,v]);G.money+=v}},exp=(l,v)=>{if(v>=1){CUR.exp.push([l,v]);G.money-=v}};
const GROW=.045;

/* ============ FIN DE SEMAINE ============ */
function endWeek(){
  const R=CUR={inc:[],exp:[],streams:0,fans0:G.fans,top:null,certs:[],ev:[],rel:[]};
  const sh=share(),lm=lmult();
  G.songs.forEach(s=>{if(s.rel!=null&&s.rel===G.t&&!s.out){s.out=1;R.rel.push(s.title);news(`Sortie : « ${s.title} » est disponible partout.`);G.feed.unshift({id:'o'+s.id,artist:G.name,title:s.title,kind:'single',t:G.t,n:0,own:s.id});if(s.clip){G.feed.unshift({id:'oc'+s.id,artist:G.name,title:s.title,kind:'clip',t:G.t,n:0,own:s.id});addClipVideo(s)}}});
  /* streams */
  const rec=released(),nOut=rec.length,nRel=Math.max(1,rec.filter(x=>G.t-x.rel<20).length);
  let single=0,fansNew=0,video=0;
  rec.forEach(s=>{
    const age=G.t-s.rel,dec=Math.pow(s.q>=70?.9:.86,age)+(s.q>=55?.04:0);
    if(age<8&&!s.viral&&Math.random()<.004+G.skills.viralite/100*.015+(s.q>60?.008:0)){s.viral=ri(3,5);s.vm=rnd(3,9);news(`🔥 « ${s.title} » explose sur les réseaux !`)}
    let fanPart=G.fans*.1*Math.pow(s.q/65,2.2)/Math.sqrt(nRel),disc=1500*Math.pow(s.q/60,2.2)*(.6+G.skills.viralite/100);
    if(s.viral>0){disc*=s.vm*6;fanPart*=1+s.vm/8;s.viral--}
    let st=(fanPart+disc)*dec*s.hype*lm*(s.genre===G.trend?1.2:1)*(1+(s.fb||0))*rnd(.9,1.1)+(s.fx||0)*dec+(s.ad||0);
    s.ad=0;st=Math.round(st);s.wk=st;s.total+=st;single+=st;
    fansNew+=st*GROW*(1+8/(1+G.fans/800))*Math.pow(s.q/65,1.3)*Math.max(.3,dec);
    if(s.clip)video+=st*.25*(s.clip/60)*.0015;
    s.hype=1+(s.hype-1)*(G.team.presse?.88:.75);
    const c=cert(s.total,CS);if(c&&c!==s.cert){s.cert=c;R.certs.push(`« ${s.title} » certifié single de ${c}`)}
  });
  const avgQ=nOut?rec.reduce((a,s)=>a+s.q,0)/nOut:0;
  const cat=nOut?G.fans*3*clamp(avgQ/60,.3,1.3)*Math.min(1,nOut/6+.15)*(G.t-G.lastRel>30?.8:1):0;
  R.streams=single+cat;G.tot.streams+=R.streams;G.yr.streams+=R.streams;R.single=single;
  let mus=(single+cat)*.0032*sh;if(G.team.manager)mus*=.9;
  inc('Streaming',mus);inc('Revenus des clips',video*sh);
  G.albums.forEach(a=>{const st=a.ids.reduce((x,id)=>{const s=G.songs.find(z=>z.id===id);return x+(s?s.wk||0:0)},0);a.units+=st/1500;
    const c=cert(a.units,CA);if(c&&c!==a.cert){a.cert=c;R.certs.push(`L'album « ${a.title} » certifié disque de ${c}`)}});
  /* charts */
  G.chart.forEach(n=>{n.age++;n.s=decayOf(n,n.age)*rnd(.93,1.07)});
  G.chart=G.chart.filter(n=>n.s>=THR*.85);
  const nn=ri(5,8);for(let i=0;i<nn;i++)npcRelease();
  let g=0;while(G.chart.length<58&&g++<400){const n=npcSongNew();if(n.base>=THR*1.2&&G.chart.filter(x=>x.artist===n.artist).length<4){n.s=n.base;G.chart.push(n)}}
  rankChart();
  rec.forEach(s=>{s.ppos=s.pos;const x=G.top.find(z=>z.me===s.id);s.pos=x?x.rk:null;
    if(s.pos){s.weeks=(s.weeks||0)+1;if(!s.peak||s.pos<s.peak){s.peak=s.pos;if(s.pos===1){G.tot.no1++;news(`👑 « ${s.title} » est numéro 1 du Top 50 !`);addFans(G.fans*.04)}else if(s.pos<=10&&s.weeks<3)news(`« ${s.title} » entre dans le top 10 (n°${s.pos}).`)}
      if(!R.top||s.pos<R.top[0])R.top=[s.pos,s.title];G.yr.best=Math.min(G.yr.best,s.pos)}});
  /* agenda : concerts, showcases, festivals */
  G.cal.filter(e=>e.t===G.t).forEach(e=>playEvent(e,fansNew));
  G.cal=G.cal.filter(e=>e.t>G.t);
  if(tourAt(G.t)){const T=TOURS[G.tour.i],V=VENUES[T.v],i=G.t-G.tour.start;
    const att=Math.round(Math.min(V.cap,Math.max(8,G.fans*.008*(.6+G.skills.charisme/100)))*rnd(.85,1));
    inc(`${T.n} (date ${i+1}/${T.d})`,att*V.p*.65);fansNew+=att*.5*(1+G.skills.charisme/100);G.health-=2;R.ev.push(`${T.n} : date ${i+1}/${T.d}, ${fmt(att)} personnes`);
    if(i+1>=T.d){news(`La ${T.n} est terminée. Standing ovation.`);G.tour=null}}
  /* réseaux : on archive la semaine, puis les contenus continuent de vivre */
  weeklySocial();
  /* vie */
  if(G.job!=null)inc(JOBS[G.job].n,JOBS[G.job].pay);
  exp('Logement',HOMES[G.home].c);exp('Vie quotidienne',30+G.home*35);
  let sal=0;TEAM.forEach(m=>{if(G.team[m.id])sal+=m.w});exp('Salaires de l\'équipe',sal);
  if(G.team.cm)NETS.forEach(n=>G.social[n.id]=Math.round(G.social[n.id]*1.006+30));
  if(G.team.coach&&G.t%2===0)gain(pick(ART));
  let rent=0;G.props.forEach(p=>{rent+=PROPS[p.i].r;p.val*=1+rnd(-.001,.0025)});inc('Loyers',rent);
  if(G.livret>0)G.livret*=1.0006;
  ASSETS.forEach(a=>{G.prices[a.id]=Math.max(1,G.prices[a.id]*(1+a.dr+a.vol*(Math.random()+Math.random()+Math.random()-1.5)*1.15));G.hist[a.id].push(G.prices[a.id]);if(G.hist[a.id].length>30)G.hist[a.id].shift()});
  if(G.own){let li=0;G.own.roster.forEach(a=>{a.pot*=rnd(.94,1.08);li+=a.pot*rnd(.6,1.4)});inc(`Label ${G.own.name}`,li)}
  if(G.money<0){G.health-=3;exp('Agios bancaires',Math.abs(G.money)*.004)}
  /* énergie utilisée -> santé */
  const used=1-G.energy/Math.max(1,maxE()-resAt(G.t));
  G.health+=used>.97?-4:used>.85?-1:3;if(G.home>=3)G.health+=1;G.health=clamp(G.health,0,100);
  /* auditeurs */
  if(G.t-G.lastRel>8&&G.fans>200){fansNew-=G.fans*.008;if((G.t-G.lastRel)%10===0)news('Ton audience s\'essouffle, ça fait longtemps que tu n\'as rien sorti.')}
  if(fansNew>0)fansNew=Math.min(fansNew,G.fans*.04+400)*(G.fans<2e4?1:clamp(1-(Math.log10(G.fans)-4.3)/2.2,.015,1));
  addFans(fansNew);
  /* temps */
  G.t++;
  if(G.t%13===0){const old=G.trend;while(G.trend===old)G.trend=pick(GENRES);news(`Nouvelle tendance : le ${G.trend} domine les playlists ce trimestre.`)}
  if(G.t%4===0)genFeats();
  if(G.t%12===0)G.prospects=[];
  rollStoryArtists();G.stories=[];G.seen={};

function doPost(net,kind,text,img){
  const K=KINDS[net][kind],q=postQual(net,img),f=G.social[net],sk=G.skills;

  if(kind==='story')G.stories.push({id,t:G.t,text,img,views:reach,replies:Math.round(reach*.01),net});
  else{const it={id,net,kind,t:G.t,text,img,wk:reach,tot:reach,likes,eng:K.eng,g:K.g,q:Math.round(q),title:text};if(net==='yt')G.videos.unshift(it);else G.posts.unshift(it)}

/* ============ SAUVEGARDE : VALIDATION ============ */
function validateSave(g){
  if(!g||g.v!==2||typeof g.name!=='string'||!g.name.trim()||g.name.length>22||!Number.isInteger(g.t)||g.t<0||!GENRES.includes(g.genre))throw Error('Sauvegarde non reconnue.');
  for(const k of['money','fans','energy','health','livret','nid','rep'])if(typeof g[k]!=='number'||!Number.isFinite(g[k]))throw Error('Valeurs invalides.');
  if(!Number.isInteger(g.home)||!HOMES[g.home]||g.job!==null&&!JOBS[g.job])throw Error('Profil invalide.');
  if(!g.skills||!Object.keys(SK).every(k=>Number.isFinite(g.skills[k])&&g.skills[k]>=0&&g.skills[k]<=100))throw Error('Compétences invalides.');
  for(const k of['songs','albums','chart','feats','items','props','offers','news','fanHist','awards','prospects','posts','videos','stories','cal','feed','top','storyArtists'])if(!Array.isArray(g[k]))throw Error('Données incomplètes.');
  if(!g.social||!NETS.every(n=>Number.isFinite(g.social[n.id])&&g.social[n.id]>=0)||!g.sh||!g.acc)throw Error('Réseaux invalides.');
  if(!g.team||!g.tot||!g.yr||!g.stocks||!g.prices||!g.hist||!g.cool||!g.reactions||!g.comments||!g.seen||!ASSETS.every(a=>g.stocks[a.id]&&Number.isFinite(g.stocks[a.id].u)&&Number.isFinite(g.prices[a.id])&&Array.isArray(g.hist[a.id])))throw Error('Finances invalides.');
  if(g.items.some(id=>!ITEMS.some(x=>x.id===id))||g.props.some(p=>!PROPS[p.i]||!Number.isFinite(p.val)))throw Error('Inventaire invalide.');
  if(g.songs.some(s=>typeof s.title!=='string'||!Number.isFinite(s.q)||!Number.isFinite(s.total)||!Number.isInteger(s.id)))throw Error('Catalogue invalide.');
  if(g.tour&&(!TOURS[g.tour.i]||!Number.isFinite(g.tour.start)))throw Error('Tournée invalide.');
  if(g.cal.some(e=>!Number.isFinite(e.t)||!Number.isFinite(e.e)||typeof e.name!=='string'))throw Error('Agenda invalide.');
  return g;
}

/* ============ Feuilles (sheets) ============ */
const SHEL=()=>$('.sheet:not([data-gone])');
function openSheet(fn,after){
  sheetFn=fn;afterClose=after||null;let sh=SHEL();
  if(!sh){
    const sc=document.createElement('div');sc.className='scrim';sc.dataset.a='close';sh=document.createElement('div');sh.className='sheet';sh.setAttribute('role','dialog');sh.setAttribute('aria-modal','true');
    sh.innerHTML='<div class="grab"><i></i></div><button class="sh-x" data-a="close" aria-label="Fermer">×</button><div class="sh-body"></div>';
    document.body.append(sc,sh);
    const gr=$('.grab',sh);let y0=0,dy=0,on=false;
    gr.addEventListener('pointerdown',e=>{on=true;y0=e.clientY;dy=0;gr.setPointerCapture(e.pointerId);sh.classList.add('drag')});
    gr.addEventListener('pointermove',e=>{if(!on)return;dy=Math.max(0,e.clientY-y0);sh.style.transform=`translateY(${dy}px)`});
    const end=()=>{if(!on)return;on=false;sh.classList.remove('drag');if(dy>110)closeSheet();else sh.style.transform=''};
    gr.addEventListener('pointerup',end);gr.addEventListener('pointercancel',end);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{sc.classList.add('on');sh.classList.add('on')}));
  }
  const b=$('.sh-body',sh);b.innerHTML=fn();b.scrollTop=0;
}
function reSheet(){const sh=SHEL();if(sh&&sheetFn){const b=$('.sh-body',sh),y=b.scrollTop;b.innerHTML=sheetFn();b.scrollTop=y}}
function closeSheet(){
  const sh=SHEL();if(!sh)return;const sc=$('.scrim:not([data-gone])');sheetFn=null;sh.dataset.gone=1;if(sc)sc.dataset.gone=1;
  sh.classList.remove('on');sh.style.transform='';sc&&sc.classList.remove('on');
  const cb=afterClose;afterClose=null;setTimeout(()=>{sh.remove();sc&&sc.remove()},450);if(cb)setTimeout(cb,300);
}
const chipsRow=(l,items,a)=>`<div><div class="hint" style="margin-bottom:8px">${l}</div><div class="chips">${items.map(([v,n,on,dis])=>`<button class="${on?'on':''}" data-a="${a}" data-v="${esc(v)}" ${dis?'disabled':''}>${esc(n)}</button>`).join('')}</div></div>`;
const ok=()=>{save();render(true)};

  ${R.top?`<div class="row"><span class="pill hot">Top 50 : n°${R.top[0]}</span><span class="hint">« ${esc(R.top[1])} »</span></div>`:''}
  ${R.burn?'<div class="pill red">Burn-out : semaine perdue</div>':''}
  ${R.rel.length?`<div><div class="hint">Sorties</div>${R.rel.map(t=>`<div class="line"><span>♫ ${esc(t)}</span></div>`).join('')}</div>`:''}
  ${R.ev.length?`<div><div class="hint">Sur scène</div>${R.ev.map(t=>`<div class="line"><span>${esc(t)}</span></div>`).join('')}</div>`:''}
  ${R.certs.length?`<div><div class="hint">Distinctions</div>${R.certs.map(t=>`<div class="line"><span>🏆 ${esc(t)}</span></div>`).join('')}</div>`:''}
  <div><div class="hint">Revenus ${eur(ti)} · Dépenses ${eur(te)}</div>${R.inc.map(x=>`<div class="line"><span>${esc(x[0])}</span><b style="color:var(--good)">+${eur(x[1])}</b></div>`).join('')}${R.exp.map(x=>`<div class="line"><span>${esc(x[0])}</span><b>-${eur(x[1])}</b></div>`).join('')}</div>
  ${news_.length?`<div><div class="hint">À la une</div>${news_.map(n=>`<div class="line"><span>${esc(n.txt)}</span></div>`).join('')}</div>`:''}
  <div><div class="hint">Calendrier à venir</div><div class="agenda">${ups.length?ups.map(arow).join(''):'<div class="hint">Rien de prévu. Pense à réserver un concert ou programmer une sortie.</div>'}</div></div>
  <button class="btn pri" data-a="close">Continuer</button>`,()=>{const i=pickEvent();if(i!=null)openEvent(i)});
}
function openEvent(i){const E=EVENTS[i];openSheet(()=>`<h2>Imprévu</h2><p>${esc(E.q())}</p><div class="btns" style="flex-direction:column;align-items:stretch">${E.c.map((c,k)=>`<button class="btn" data-a="evc" data-v="${i}:${k}">${c[0]}</button>`).join('')}</div>`)}

/* ============ Stories ============ */
let svT=null,sv=null;
function openSV(list){if(!list.length)return;sv={list,i:0};if(!$('#sv')){const e=document.createElement('div');e.id='sv';document.body.append(e)}showSV()}
function showSV(){const el=$('#sv');if(!el||!sv)return;const it=sv.list[sv.i];el.style.background=`linear-gradient(160deg,${it.bg[0]},${it.bg[1]})`;
  el.innerHTML=`<div class="sv-bars">${sv.list.map((_,k)=>`<i class="${k<sv.i?'done':k===sv.i?'cur':''}"><b></b></i>`).join('')}</div><div class="sv-head">${portrait(it.name,36)}<b>${esc(it.name)}</b><span class="hint" style="color:rgba(255,255,255,.7)">${esc(it.sub||'')}</span><button class="sv-x" data-a="svx" aria-label="Fermer">×</button></div><div class="sv-body">${it.img?`<img src="${it.img}" alt="">`:''}<p>${esc(it.text)}</p>${it.foot?`<span class="pill">${esc(it.foot)}</span>`:''}</div><div class="sv-tap"><div data-a="svprev"></div><div data-a="svnext"></div></div>`;
  clearTimeout(svT);svT=setTimeout(()=>A.svnext(),4500)}

/* ============ Actions ============ */
const A={};
const setr=(o,k,num)=>v=>{o()[k]=num?+v:v;reSheet()};
Object.assign(A,{
  close:()=>closeSheet(),
  prof:v=>{draft.name=($('#wname')||{}).value||draft.name;draft.profile=v;render()},
  gen:v=>{draft.name=($('#wname')||{}).value||draft.name;draft.genre=v;render()},
  start:()=>{const n=(($('#wname')||{}).value||'').trim();if(!n)return toast('Choisis un nom d\'artiste.');newGame(n,draft.genre,draft.profile);tab='home';sub={music:'studio',charts:'top',social:'feed',life:'skills'};render()},
  tab:v=>{tab=v;render()},sub:v=>{sub[tab]=v;render()},
  next:()=>{if(SHEL())return;endWeek()},
  plus:()=>openSheet(sheetPlus),opts:()=>openSheet(sheetOpts),
  sf:v=>{sf=v;render(true)},dc:v=>{dir.c=v;dir.n=30;render(true)},dg:v=>{dir.g=v;dir.n=30;render(true)},dmore:()=>{dir.n+=30;dirList()},
  /* son */
  newsong:()=>{draftS={title:title(),genre:G.genre,eff:1,studio:0,beat:0,feat:-1};openSheet(sheetSong)},
  sg:setr(()=>draftS,'genre'),se:setr(()=>draftS,'eff',1),ss:setr(()=>draftS,'studio',1),sb:setr(()=>draftS,'beat',1),sf_:setr(()=>draftS,'feat',1),
  makesong:()=>{const d=draftS;d.title=(($('#sTitle')||{}).value||d.title).trim()||title();const f=d.feat>=0?G.feats[d.feat]:null,cost=STUDIO[d.studio].c+BEAT[d.beat].c+(f?f.price:0);
    if(!canPay(cost)||!useE(EFFORT[d.eff].e))return;G.money-=cost;const q=Math.round(songQ(d));
    const s={id:G.nid++,title:d.title.slice(0,40),genre:d.genre,q,hype:1,total:0,wk:0,rel:null,feat:f?f.name:null,fb:f?clamp(Math.log10(1+f.ml*1e6/Math.max(G.fans,100))*.12,0,.6):0,fx:f?f.ml*1e6*.003:0,ad:0,clip:0,cover:null};
    G.songs.push(s);G.nextBonus=0;if(Math.random()<.35)gain(pick(['voix','ecriture','flow']));closeSheet();ok();toast(`« ${s.title} » est dans le tiroir (qualité ${q}).`)},
  song:v=>openSheet(()=>sheetSongInfo(+v)),
  rel:v=>{draftR={id:+v,w:1,clip:-1,ad:-1};openSheet(sheetRel)},
  rw:setr(()=>draftR,'w',1),rc:setr(()=>draftR,'clip',1),ra:setr(()=>draftR,'ad',1),
  relgo:()=>{const d=draftR,s=G.songs.find(x=>x.id===d.id),cost=(d.clip>=0?CLIP[d.clip].c:0)+(d.ad>=0?ADS[d.ad].c:0);if(!s||!canPay(cost))return;if(d.clip>=0&&!useE(10))return;
    G.money-=cost;s.rel=G.t+d.w;if(d.clip>=0)s.clip=Math.round(clamp(12+G.skills.clips*.5+CLIP[d.clip].b*1.3+rnd(-6,8),5,100));if(d.ad>=0)s.hype=1+ADS[d.ad].h*4;G.lastRel=Math.max(G.lastRel,s.rel);
    closeSheet();ok();toast(d.w===0?'Ton titre sort à la fin de la semaine.':`Sortie programmée le ${wlab(s.rel)}.`)},
  sCover:(f,el)=>readImage(f).then(u=>{const s=G.songs.find(x=>x.id==el.dataset.v);if(s){s.cover=u;ok();reSheet()}}).catch(()=>toast('Image illisible.')),
  /* album */
  newalbum:()=>{draftA={title:title(),ids:[],cover:null};openSheet(sheetAlbum)},
  at:v=>{const i=+v,k=draftA.ids.indexOf(i);k>=0?draftA.ids.splice(k,1):draftA.ids.push(i);reSheet()},
  aCover:(f,el)=>readImage(f).then(u=>{const id=el.dataset.v;if(id){const a=G.albums.find(x=>x.id==id);if(a){a.cover=u;ok();reSheet()}}else{draftA.cover=u;reSheet()}}).catch(()=>toast('Image illisible.')),
  albumgo:()=>{const d=draftA;d.title=(($('#aTitle')||{}).value||d.title).trim()||'Sans titre';if(!useE(10))return;const sel=d.ids.map(i=>G.songs.find(s=>s.id===i)).filter(Boolean),q=sel.reduce((a,s)=>a+s.q,0)/sel.length;
    G.albums.push({id:G.nid++,title:d.title.slice(0,40),ids:d.ids.slice(),units:0,cert:null,q,cover:d.cover,t:G.t});G.yr.albumQ=Math.max(G.yr.albumQ,q);addFans(G.fans*.02*q/60);G.lastRel=G.t;
    G.feed.unshift({id:'al'+G.nid,artist:G.name,title:d.title,kind:'album',t:G.t,n:0,own:1});news(`Ton album « ${d.title} » est disponible.`);closeSheet();ok();toast('Album sorti.')},
  album:v=>openSheet(()=>sheetAlbumInfo(+v)),
  /* réseaux */
  post:v=>{const[n,k]=(v||'ig:photo').split(':');newPost(n,k);openSheet(sheetPost)},
  pn:v=>{newPost(v,Object.keys(KINDS[v])[0]);reSheet()},pk:v=>{newPost(draftP.net,v);reSheet()},
  pImg:f=>readImage(f,520).then(u=>{draftP.img=u;reSheet()}).catch(()=>toast('Image illisible.')),
  postgo:()=>{const d=draftP,K=KINDS[d.net][d.kind];d.text=(($('#pText')||{}).value||d.text).trim()||'...';if(!useE(K.e))return;const r=doPost(d.net,d.kind,d.text,d.img);closeSheet();ok();
    toast(`${K.n} publié : ${fmt(r.reach)} ${d.net==='yt'?'vues':'de portée'}, ${r.gn>=0?'+':''}${fmt(r.gn)} abonnés${r.vir?' 🔥':''}`)},
  item:v=>openSheet(()=>sheetItem(v)),
  story:n=>{const h=hash(n);G.seen[n]=1;render(true);openSV([0,1,2].slice(0,1+h%3).map(i=>({name:n,sub:`il y a ${ri(1,20)} h`,text:STORY_TEXT[(h+i*3)%STORY_TEXT.length],bg:STORY_BG[(h+i)%STORY_BG.length]})))},
  myStory:()=>openSV(G.stories.map(s=>({name:G.name,sub:'à l\'instant',text:s.text,img:s.img,bg:STORY_BG[hash(s.id)%STORY_BG.length],foot:`${fmt(s.views)} vues · ${fmt(s.replies)} réponses`}))),
  svnext:()=>{if(!sv)return;if(sv.i>=sv.list.length-1)return A.svx();sv.i++;showSV()},svprev:()=>{if(!sv)return;if(sv.i>0)sv.i--;showSV()},svx:()=>{clearTimeout(svT);sv=null;const e=$('#sv');if(e)e.remove()},
  /* agenda */
  book:()=>{draftB={kind:'gig',v:0,w:1};openSheet(sheetBook)},
  bk:v=>{draftB.kind=v;draftB.v=0;reSheet()},bv:setr(()=>draftB,'v',1),bw:setr(()=>draftB,'w',1),
  bookgo:()=>{const d=draftB,t=G.t+d.w,e=bookE(d.kind);if(!weekOk(t,d))return toast('Cette période n\'est pas disponible.');if(d.w===0&&!useE(e))return;
    if(d.kind==='tour'){G.tour={i:d.v,start:t};if(d.w===0&&false)G.energy+=0}
    else if(d.kind==='gig')G.cal.push({t,kind:'gig',v:d.v,name:VENUES[d.v].n,e});
    else G.cal.push({t,kind:'showcase',v:d.v,name:pick(SHOWS[d.v].names),e});
    closeSheet();ok();toast('Réservé. L\'énergie est bloquée sur cette semaine.')},
  offer:v=>openSheet(()=>sheetOffer(+v)),
  offerno:v=>{const o=G.offers[+v];if(o&&o.type==='label')G.cool[o.lid]=G.t+10;G.offers.splice(+v,1);closeSheet();ok()},
  offerok:v=>{const i=+v,o=G.offers[i];if(!o)return;
    if(o.type==='label'){if(G.label||G.own)return;G.label={lid:o.lid,name:o.name,share:o.share,mult:o.mult,adv:o.adv,since:G.t};G.money+=o.adv;news(`Tu signes chez ${o.name} (avance ${eur(o.adv)}).`)}
    else if(o.type==='festival'){const d={kind:'festival',w:o.wk-G.t};if(busy(o.wk)||resAt(o.wk)+20>maxE()-20)return toast('Tu es déjà pris cette semaine-là.');if(o.wk===G.t&&!useE(20))return;G.cal.push({t:o.wk,kind:'festival',name:o.name,pay:o.pay,e:20})}
    else if(o.type==='feat'){G.money+=o.pay;addFans(G.fans*.03);gain('charisme',0);news(`Feat avec ${o.name} : ton audience grimpe.`)}
    else{G.money+=o.pay;G.rep=clamp(G.rep-1,0,100);news(`Partenariat signé (${eur(o.pay)}).`)}
    G.offers.splice(i,1);closeSheet();ok();toast('Accepté.')},
  artist:n=>{if(AMAP.has(n))openSheet(()=>sheetArtist(n))},
  askfeat:n=>{const a=AMAP.get(n);G.feats.unshift({name:a.n,ml:a.ml,price:Math.max(150,Math.round(a.ml*1e6*.006))});if(G.feats.length>8)G.feats.length=8;closeSheet();ok();toast(`${a.n} est disponible dans tes featurings.`)},
  /* vie */
  train:k=>{const c=30+Math.round(G.skills[k]*3);if(!canPay(c)||!useE(10))return;G.money-=c;const g=Math.random()<.4?2:1;gain(k,g);ok();toast(`${SK[k]} +${g}`)},
  rest:()=>{if(!useE(15))return;G.health=Math.min(100,G.health+14);ok();toast('Repos. Santé +14.')},
  job:v=>{G.job=+v;G.energy=Math.min(G.energy,maxE());ok()},quit:()=>{G.job=null;ok()},home:v=>{G.home=+v;G.energy=Math.min(G.energy,maxE());ok()},
  'item$':v=>{const x=ITEMS.find(i=>i.id===v);if(!canPay(x.c))return;G.money-=x.c;G.items.push(x.id);gain('charisme',x.ch);ok()},
  liv:v=>{const n=+v;if(n>0){if(!canPay(n))return;G.money-=n;G.livret+=n}else{const m=Math.min(-n,G.livret);G.livret-=m;G.money+=m}ok()},
  buy:id=>{if(!canPay(1000))return;G.money-=1000;G.stocks[id].u+=1000/G.prices[id];ok()},
  sell:id=>{G.money+=G.stocks[id].u*G.prices[id];G.stocks[id].u=0;ok()},
  prop:v=>{const p=PROPS[+v];if(!canPay(p.c))return;G.money-=p.c;G.props.push({i:+v,val:p.c});ok()},
  hire:v=>{G.team[v]=1;ok()},fire:v=>{delete G.team[v];ok()},
  demo:id=>{const L=LMAP[id];if(!useE(6))return;G.prospects.push(id);const avgQ=released().length?released().reduce((a,s)=>a+s.q,0)/released().length:30,
    p=.25+clamp((G.fans/L.min-1)*.12,0,.4)+avgQ/300+G.skills.nego/400;
    if(Math.random()<p){const d=dealFor(L,G.fans);G.offers.push({type:'label',...d,exp:G.t+4});news(`${L.n} répond à ta démo et propose un contrat.`);toast(`${L.n} t'a répondu : offre dans tes opportunités.`)}
    else{G.cool[id]=G.t+12;toast(`${L.n} décline pour le moment.`)}ok()},
  leave:()=>{const f=G.label.adv*.3;if(!canPay(f))return;G.money-=f;G.cool[G.label.lid]=G.t+26;news(`Tu quittes ${G.label.name}.`);G.label=null;ok()},
  own:()=>{if(!canPay(6e4))return;G.money-=6e4;G.own={name:G.name+' Records',roster:[]};G.label=null;news('Tu fondes ton propre label.');ok()},
  talent:()=>{if(!canPay(8000))return;G.money-=8000;G.own.roster.push({n:pick(TALENT),pot:rnd(150,500)});ok()},
  evc:v=>{const[i,k]=v.split(':').map(Number),r=EVENTS[i].c[k][1]();save();render(true);openSheet(()=>`<h2>Résultat</h2><p>${esc(r)}</p><button class="btn pri" data-a="close">OK</button>`)},
  /* données */
  export:()=>{const b=new Blob([JSON.stringify(G)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`backstage-${G.name.replace(/\W+/g,'_')}-S${G.t}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2e3)},
  import:f=>{if(!f)return;const r=new FileReader();r.onload=()=>{try{G=validateSave(JSON.parse(r.result));save();closeSheet();tab='home';render();toast('Carrière importée.')}catch(e){toast(e.message||'Fichier invalide.')}};r.readAsText(f)},
  reset:()=>openSheet(()=>`<h2>Tout effacer ?</h2><p>Ta carrière actuelle sera supprimée. Pense à l'exporter avant.</p><div class="btns"><button class="btn danger" data-a="reset2">Effacer</button><button class="btn" data-a="close">Annuler</button></div>`),
  reset2:()=>{try{localStorage.removeItem(KEY)}catch(e){}G=null;closeSheet();render()},
});

/* ============ Démarrage ============ */
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.matches('input'))return;const f=A[t.dataset.a];if(!f)return;f(t.dataset.v,t);if(G&&t.dataset.a!=='next')save()});
document.addEventListener('change',e=>{const t=e.target;if(t.matches('input[type=file]')){const f=A[t.dataset.a];if(f)f(t.files[0],t);t.value=''}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='sTitle'&&draftS)draftS.title=t.value;else if(t.id==='pText'&&draftP)draftP.text=t.value;else if(t.id==='aTitle'&&draftA)draftA.title=t.value;else if(t.id==='wname')draft.name=t.value;else if(t.id==='dq'){dir.q=t.value;dir.n=30;dirList()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(sv)A.svx();else closeSheet()}});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
$('#app').addEventListener('scroll',onScroll,{passive:true});
try{G=load()}catch(e){G=null}
render();
</script>
</body>
